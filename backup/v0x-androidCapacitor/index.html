<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>多人桌游计时器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f0f1a;color:#fff;min-height:100vh}
.screen{display:none;padding:20px;max-width:480px;margin:0 auto}
.screen.active{display:block}
.sound-toggle{position:fixed;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(15,15,26,0.8);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);font-size:16px;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.sound-toggle.on{color:#fff;border-color:rgba(255,255,255,0.3)}
.main-title{text-align:center;font-size:26px;font-weight:800;margin:28px 0 6px;background:linear-gradient(135deg,#00d4ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.main-sub{text-align:center;color:#666;font-size:13px;margin-bottom:28px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.mode-card{background:#1a1a2e;border-radius:16px;padding:16px 14px;border:2px solid #2a2a3e;cursor:pointer;transition:all .2s;text-align:center}
.mode-card:active{transform:scale(.97)}
.mode-card.selected{border-color:#00d4ff;background:#00d4ff12}
.mode-icon{font-size:28px;margin-bottom:6px}
.mode-name{font-size:14px;font-weight:700;margin-bottom:4px}
.mode-desc{font-size:11px;color:#666;line-height:1.4}
.form-group{margin-bottom:18px}
.form-label{font-size:13px;color:#888;margin-bottom:8px;display:block}
.form-row{display:flex;gap:10px;align-items:center}
.num-input{width:70px;height:44px;border-radius:10px;border:1px solid #333;background:#1a1a2e;color:#fff;font-size:18px;text-align:center;outline:none}
.num-input:focus{border-color:#00d4ff}
.time-unit{color:#666;font-size:12px}
.player-names-list{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.name-input{height:40px;border-radius:8px;border:1px solid #2a2a3e;background:#1a1a2e;color:#fff;font-size:14px;padding:0 12px;outline:none;transition:border .2s}
.name-input:focus{border-color:#00d4ff}
.mode-settings{background:#14142a;border-radius:14px;padding:14px;margin-bottom:18px}
.mode-settings-title{font-size:12px;color:#555;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.setting-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.setting-row:last-child{margin-bottom:0}
.setting-label{font-size:13px;color:#aaa;min-width:90px}
.start-btn{width:100%;height:54px;border-radius:14px;border:none;background:linear-gradient(135deg,#00d4ff,#7b2ff7);color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;transition:opacity .2s}
.start-btn:active{opacity:.8}
#gameScreen{position:relative;cursor:pointer;user-select:none;padding:0;max-width:100%}
.game-inner{padding:14px 16px;max-width:480px;margin:0 auto;position:relative;z-index:1}
.game-bg{position:fixed;inset:0;z-index:0;background:var(--gc,#0f0f1a);transition:background .6s ease}
.game-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--pc) 18%,transparent),transparent 70%)}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative;z-index:2}
.round-badge{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:5px 14px;font-size:12px;color:rgba(255,255,255,0.6)}
.round-badge span{font-weight:700;color:var(--pc)}
.exit-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:5px 14px;color:rgba(255,255,255,0.4);font-size:12px;cursor:pointer;position:relative;z-index:2}
.round-progress{display:flex;gap:6px;justify-content:center;margin-bottom:16px;position:relative;z-index:2}
.round-dot{width:10px;height:10px;border-radius:50%;background:#333;transition:all .3s}
.round-dot.done{background:var(--pc);box-shadow:0 0 6px var(--pc)}
.round-dot.active{background:var(--pc);box-shadow:0 0 10px var(--pc);transform:scale(1.3)}
.current-card{border-radius:24px;padding:24px 20px;margin-bottom:14px;position:relative;z-index:2;text-align:center;background:color-mix(in srgb,var(--pc) 8%,#1a1a2e);border:2px solid color-mix(in srgb,var(--pc) 30%,transparent);transition:all .3s}
.current-card.idle{background:#1a1a2e;border-color:#2a2a3e}
.current-label{font-size:11px;text-transform:uppercase;letter-spacing:3px;color:var(--pc);margin-bottom:4px;opacity:.7}
.current-label.idle{color:#555}
.current-name{font-size:26px;font-weight:800;margin-bottom:8px;color:var(--pc)}
.lives-row{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.life-dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:var(--pc);color:#000;box-shadow:0 0 10px color-mix(in srgb,var(--pc) 60%,transparent);transition:all .3s}
.life-dot.lost{background:#2a2a3e;color:#444;box-shadow:none}
.timer-lg{font-size:76px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-3px;line-height:1;margin-bottom:6px;transition:color .3s}
.timer-lg.timeout{font-size:56px}
#timerSub2{font-size:22px;font-weight:700;color:rgba(255,255,255,0.85);letter-spacing:1px}
.timer-n{color:#fff}
.timer-w{color:#ffaa00}
.timer-d{color:#ff4757}
.timer-sub{font-size:18px;color:rgba(255,255,255,0.7);margin-bottom:8px;min-height:22px;font-weight:600}
.tap-hint{font-size:16px;color:rgba(255,255,255,0.5);margin-top:14px;font-weight:600}
.idle-hint{font-size:15px;padding:20px 0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overtime-tag{display:inline-block;background:color-mix(in srgb,var(--pc) 20%,transparent);border:1px solid var(--pc);color:var(--pc);font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;margin-bottom:8px}
.elim-tag{display:inline-block;background:#ff4757;color:#fff;font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;margin-top:8px}
.players-grid{display:grid;gap:8px;position:relative;z-index:2}
.p-card{border-radius:14px;padding:14px 16px;background:color-mix(in srgb,var(--gc) 70%,transparent);border:2px solid color-mix(in srgb,var(--pc) 12%,transparent);cursor:pointer;transition:all .2s;position:relative}
.p-card:active{transform:scale(.98)}
.p-card.active{border-color:color-mix(in srgb,var(--pc) 60%,transparent);background:color-mix(in srgb,var(--pc) 15%,#1a1a2e)}
.p-card.done{opacity:.5;cursor:default;pointer-events:none}
.p-card.elim{opacity:.3;cursor:default;pointer-events:none}
.p-card.waiting{cursor:pointer}
.p-card-top{height:4px;border-radius:2px;margin-bottom:10px;background:var(--pc);opacity:.4}
.p-card.active .p-card-top{opacity:1}
.p-card-info{display:flex;align-items:center;gap:10px}
.p-card-name{font-size:15px;font-weight:700;flex:1}
.p-card.active .p-card-name{color:var(--pc)}
.p-card-timer{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:rgba(255,255,255,0.5)}
.p-card.active .p-card-timer{color:var(--pc)}
.p-card-lives{display:flex;gap:3px;margin-top:6px}
.p-life{width:9px;height:9px;border-radius:50%}
.p-life.alive{background:var(--pc)}
.p-life.dead{background:#333}
.done-badge{font-size:11px;color:rgba(255,255,255,0.3)}
.over-title{font-size:30px;font-weight:800;text-align:center;margin:40px 0 6px;background:linear-gradient(135deg,#00d4ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.over-sub{text-align:center;color:#666;font-size:13px;margin-bottom:30px}
.result-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.result-item{display:flex;align-items:center;gap:12px;background:#1a1a2e;border-radius:14px;padding:14px 16px}
.result-rank{font-size:22px;font-weight:800;width:32px}
.rank-1{color:#ffd700}
.rank-2{color:#c0c0c0}
.rank-3{color:#cd7f32}
.result-info{flex:1}
.result-name{font-size:15px;font-weight:600}
.result-detail{font-size:12px;color:#666;margin-top:2px}
.result-elim{font-size:12px;color:#ff4757}
.restart-btn{width:100%;height:54px;border-radius:14px;border:none;background:linear-gradient(135deg,#00d4ff,#7b2ff7);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<button class="sound-toggle on" id="soundToggle" onclick="toggleSound(event)">&#x1F514;</button>

<div class="screen active" id="setupScreen">
<h1 class="main-title">&#x1F3B2; 桌游计时器</h1>
<p class="main-sub">选择计时模式 &#x2192; 设置玩家 &#x2192; 开始游戏</p>
<div class="form-group">
<label class="form-label">计时模式</label>
<div class="mode-grid" id="modeGrid"></div>
</div>
<div id="modeSettings" class="mode-settings">
<div class="mode-settings-title" id="modeSettingsTitle">模式设置</div>
<div id="modeSettingsBody"></div>
</div>
<div class="form-group">
<label class="form-label">玩家人数</label>
<div class="form-row">
<input type="number" class="num-input" id="playerCountInput" value="4" min="1" oninput="onPlayerCountChange()">
<span class="time-unit">人</span>
</div>
</div>
<div class="form-group">
<label class="form-label">玩家名称（选填）</label>
<div class="player-names-list" id="playerNamesList"></div>
</div>
<button class="start-btn" onclick="startGame()">开始游戏</button>
</div>

<div class="screen" id="gameScreen" onclick="onScreenTap(event)">
<div class="game-bg" id="gameBg"></div>
<div class="game-inner">
<div class="game-header">
<div class="round-badge">第 <span id="roundNum">1</span> 回合</div>
<div style="display:flex;gap:8px">
<button class="exit-btn" id="pauseBtn" onclick="togglePause()" style="display:none">&#x23F8; 暂停</button>
<button class="exit-btn" onclick="confirmExit()">结束</button>
</div>
</div>
<div class="round-progress" id="roundProgress"></div>
<div class="current-card idle" id="currentCard">
<div class="idle-hint" id="idleHint"><span style="font-size:18px;color:rgba(255,255,255,0.5)">点击&nbsp;</span><span style="font-size:22px;font-weight:800;color:#FFD93D">任意位置</span><span style="font-size:18px;color:rgba(255,255,255,0.5)">&nbsp;或&nbsp;</span><span style="font-size:22px;font-weight:800;color:#4ECDC4">玩家栏</span><span style="font-size:18px;color:rgba(255,255,255,0.5)">&nbsp;开始计时</span></div>
<div class="current-label idle" id="currentLabel" style="display:none">当前计时</div>
<div class="current-name" id="currentName" style="display:none"></div>
<div class="lives-row" id="livesRow" style="display:none"></div>
<div class="overtime-tag" id="overtimeTag" style="display:none">&#x23F8; 超时</div>
<div class="timer-lg timer-n" id="timerDisplay" style="display:none">60</div>
<div class="timer-sub" id="timerSub" style="display:none"></div>
<div class="timer-sub" id="timerSub2" style="display:none;font-size:20px;font-weight:700;color:rgba(255,255,255,0.65)"></div>
<div class="elim-tag" id="elimTag" style="display:none">&#x1F480; 已淘汰</div>
<div class="tap-hint" id="tapHint" style="display:none">点击任意处结束回合</div>
</div>
<div class="players-grid" id="playersGrid"></div>
</div>
</div>

<div id="pauseOverlay" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;flex-direction:column;gap:20px">
<div style="font-size:52px;font-weight:800;color:#fff">&#x23F8; 已暂停</div>
<button onclick="togglePause()" style="padding:14px 40px;border-radius:14px;border:none;background:linear-gradient(135deg,#00d4ff,#7b2ff7);color:#fff;font-size:20px;font-weight:700;cursor:pointer">继续 ▶</button>
</div>

<div class="screen" id="overScreen">
<h1 class="over-title">&#x1F3C6; 游戏结束</h1>
<p class="over-sub" id="overSub">共进行了 1 回合</p>
<div class="result-list" id="resultList"></div>
<button class="restart-btn" onclick="playAgain()">再来一局</button>
</div>

<script>
var PALETTE=['#FF6B6B','#4ECDC4','#FFD93D','#6BCB77','#4D96FF','#FF9F43','#A29BFE','#FD79A8'];
var MAX_LIVES=3;
var modeId='individual';
var playerCount=4;
var players=[];
var currentIndex=-1;
var round=1;
var timer=null;
var remaining=0;
var soundOn=true;
var eliminated={};
var lives={};
var turnsThisRound={};
var timedOut=false;
var isPaused=false;
var pausedAt=0;
var turnStartTime=0;
var poolDisplay=0; // \u6C60\u6A21\u5F0F\u663E\u793A\u7528\uFF0C\u4E0D\u5F71\u54CD\u5B9E\u9645\u6C60\u503C
var root=document.documentElement;
var girlVoice=null;

function initVoice(){
  try{
    var voices=speechSynthesis.getVoices();
    for(var i=0;i<voices.length;i++){
      var v=voices[i];
      if((v.lang.indexOf('zh')>-1||v.lang.indexOf('CN')>-1)&&(v.name.toLowerCase().indexOf('female')>-1||v.name.toLowerCase().indexOf('girl')>-1||v.name.indexOf('女')>-1)){
        girlVoice=v;break;
      }
    }
    if(!girlVoice){
      for(i=0;i<voices.length;i++){
        if(voices[i].lang.indexOf('zh')>-1){girlVoice=voices[i];break;}
      }
    }
  }catch(e){}
}
try{speechSynthesis.onvoiceschanged=initVoice;}catch(e){}
initVoice();

var audioCtx;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function beep(freq,dur,type,vol){
  if(!soundOn)return;
  try{var ctx=getAudio(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;o.type=type||'sine';g.gain.setValueAtTime(vol||.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.start();o.stop(ctx.currentTime+dur);}catch(e){}
}
function sTick(){beep(900,.07);}
function sWarn(){beep(550,.18,'square');}
function sFinish(){beep(1300,.1);setTimeout(function(){beep(1700,.15);},80);}
function sElim(){beep(280,.35,'sawtooth');}
function sLifeLost(){beep(400,.15);setTimeout(function(){beep(200,.3,'sawtooth');},150);}
function sRoundDone(){[600,800,1000].forEach(function(f,i){setTimeout(function(){beep(f,.15);},i*80);});}
function sOver(){[380,480,580,780].forEach(function(f,i){setTimeout(function(){beep(f,.2);},i*110);});}
function speakNumber(n){
  if(!soundOn)return;
  try{var utt=new SpeechSynthesisUtterance(String(n));utt.lang='zh-CN';utt.volume=.9;utt.rate=1.3;if(girlVoice)utt.voice=girlVoice;speechSynthesis.cancel();speechSynthesis.speak(utt);}catch(e){}
}

var MODES=[
  {id:'individual',icon:'⏱',name:'限时回合',desc:'每人独立倒计时，轮到自己开始计时',settings:[{key:'time',label:'每人每回合时间',unit:'秒',def:60,min:5,max:600}]},
  {id:'personalpool',icon:'⏳',name:'个人时间池',desc:'每人独立时间池，轮到自己时间倒扣',settings:[{key:'total',label:'个人总时间',unit:'分钟',def:5,min:1,max:30}]},
  {id:'accelerate',icon:'⚡',name:'累进加速',desc:'每轮时间递减，越来越快',settings:[{key:'start',label:'首回合时间',unit:'秒',def:60,min:5,max:300},{key:'dec',label:'每轮递减',unit:'秒',def:5,min:1,max:60},{key:'min',label:'每轮最少时间',unit:'秒',def:15,min:5,max:60}]},
  {id:'decelerate',icon:'🐢',name:'累进减速',desc:'每轮时间递增，前期快后期慢',settings:[{key:'start',label:'首回合时间',unit:'秒',def:5,min:3,max:60},{key:'inc',label:'每轮递增',unit:'秒',def:5,min:1,max:30},{key:'max',label:'每轮最长时间',unit:'分钟',def:3,min:1,max:10}]},
  {id:'bank',icon:'🔄',name:'共享时间池',desc:'所有玩家共用同一时间池，先耗尽者出局',settings:[{key:'pool',label:'时间池总量',unit:'分钟',def:10,min:1,max:30}]},
  {id:'advanced',icon:'🎯',name:'进阶模式',desc:'每玩家独立设置，支持回合限制+总时间+每轮递增',settings:[{key:'perturn',label:'每人每回合时间',unit:'秒',def:60,min:5,max:600},{key:'pertotal',label:'每人总时间',unit:'分钟',def:6,min:1,max:30},{key:'perround',label:'每轮递增',unit:'秒',def:0,options:[-30,-10,-5,0,5,10,30]},{key:'permaxt',label:'回合时间上限',unit:'分钟',def:3,options:[1,3,5,10]}]}
];

function renderSetup(){
  var grid=document.getElementById('modeGrid');
  grid.innerHTML='';
  MODES.forEach(function(m){
    var card=document.createElement('div');
    card.className='mode-card'+(m.id===modeId?' selected':'');
    card.innerHTML='<div class="mode-icon">'+m.icon+'</div><div class="mode-name">'+m.name+'</div><div class="mode-desc">'+m.desc+'</div>';
    card.onclick=function(id){return function(){modeId=id;renderSetup();};}(m.id);
    grid.appendChild(card);
  });
  updateModeSettings();
  updateNameInputs();
}

function updateModeSettings(){
  var m=MODES.find(function(x){return x.id===modeId;});
  document.getElementById('modeSettingsTitle').textContent='「'+m.name+'」设置';
  var container=document.getElementById('modeSettings');
  container.style.display='';
  var body=document.getElementById('modeSettingsBody');
  body.innerHTML='';
  m.settings.forEach(function(s){
    var row=document.createElement('div');
    row.className='setting-row';
    var inp;
    if(s.options){
      inp='<select class="num-input" id="ms_'+s.key+'">';
      s.options.forEach(function(o){inp+='<option value="'+o+'"'+(o===s.def?' selected':'')+'>'+o+'</option>';});
      inp+='</select>';
    }else{
      inp='<input type="number" class="num-input" id="ms_'+s.key+'" value="'+s.def+'" min="'+(s.min||0)+'" max="'+(s.max||'')+'">';
    }
    row.innerHTML='<span class="setting-label">'+s.label+'</span>'+inp+'<span class="time-unit">'+s.unit+'</span>';
    body.appendChild(row);
  });
}

function getModeSettings(){
  var m=MODES.find(function(x){return x.id===modeId;});
  var result={};
  m.settings.forEach(function(s){
    var el=document.getElementById('ms_'+s.key);
    result[s.key]=el?(parseInt(el.value)||s.def):s.def;
  });
  return result;
}

function onPlayerCountChange(){
  playerCount=Math.max(1,parseInt(document.getElementById('playerCountInput').value)||1);
  updateNameInputs();
}

function updateNameInputs(){
  var list=document.getElementById('playerNamesList');
  list.innerHTML='';
  for(var i=1;i<=playerCount;i++){
    var inp=document.createElement('input');
    inp.className='name-input';
    inp.placeholder='玩家 '+i;
    inp.maxLength=10;
    list.appendChild(inp);
  }
}

function startGame(){
  playerCount=Math.max(1,parseInt(document.getElementById('playerCountInput').value)||1);
  var ms=getModeSettings();
  var nameInputs=document.querySelectorAll('.name-input');
  players=[];
  for(var i=0;i<playerCount;i++){
    var name=(nameInputs[i]&&nameInputs[i].value.trim())||'玩家'+(i+1);
    var color=PALETTE[i%PALETTE.length];
    var p={name:name,color:color};
    if(modeId==='individual'){p.time=ms.time||60;p.initial=ms.time||60;}
    else if(modeId==='bank'){p.time=(ms.pool||10)*60;p.pool=(ms.pool||10)*60;}
    else if(modeId==='accelerate'){p.time=ms.start||60;p.initial=ms.start||60;p.dec=ms.dec||5;p.min=ms.min||15;}
    else if(modeId==='decelerate'){p.time=ms.start||5;p.initial=ms.start||5;p.inc=ms.inc||5;p.max=(ms.max||3)*60;}
    else if(modeId==='personalpool'){p.time=(ms.total||5)*60;p.pool=(ms.total||5)*60;}
    else if(modeId==='advanced'){p.time=(ms.pertotal||6)*60;p.pool=(ms.pertotal||6)*60;p.perturn=ms.perturn||60;p.perround=ms.perround||0;p.permaxt=(ms.permaxt||3)*60;p.permint=15;}
    players.push(p);
  }
  lives={};eliminated={};turnsThisRound={};
  for(var j=0;j<players.length;j++){lives[j]=MAX_LIVES;eliminated[j]=false;turnsThisRound[j]=false;}
  currentIndex=-1;round=1;timedOut=false;isPaused=false;gameStarted=false;
  if(timer)clearInterval(timer);
  document.getElementById('pauseOverlay').style.display='none';
  showScreen('gameScreen');
  applyColor(-1);
  renderGame();
}

function showScreen(id){
  ['setupScreen','gameScreen','overScreen'].forEach(function(s){document.getElementById(s).classList.toggle('active',s===id);});
}

function applyColor(idx){
  var c=(idx>=0&&players[idx])?players[idx].color:PALETTE[0];
  root.style.setProperty('--pc',c);
}

function renderRoundProgress(){
  var container=document.getElementById('roundProgress');
  container.innerHTML='';
  for(var i=0;i<players.length;i++){
    var dot=document.createElement('div');
    dot.className='round-dot';
    if(eliminated[i])dot.style.background='#ff4757';
    else if(turnsThisRound[i])dot.classList.add('done');
    else if(i===currentIndex)dot.classList.add('active');
    container.appendChild(dot);
  }
}

function renderGame(){
  document.getElementById('roundNum').textContent=round;
  applyColor(currentIndex);
  renderRoundProgress();
  renderPlayersGrid();
  if(currentIndex>=0){showActiveCard(currentIndex);}
  else{showIdleCard();}
  updatePauseBtn();
}

function showActiveCard(idx){
  var card=document.getElementById('currentCard');
  card.classList.remove('idle');
  document.getElementById('idleHint').style.display='none';
  ['currentLabel','currentName','livesRow','timerDisplay','timerSub','tapHint'].forEach(function(id){document.getElementById(id).style.display='';});
  document.getElementById('currentLabel').classList.remove('idle');
  document.getElementById('currentName').textContent=players[idx].name;
  document.getElementById('elimTag').style.display=eliminated[idx]?'':'none';
  document.getElementById('overtimeTag').style.display='none';
  document.getElementById('timerDisplay').className='timer-lg timer-n';
  document.getElementById('timerDisplay').textContent=remaining;
  document.getElementById('timerSub').textContent='';
  // advanced mode: show per-turn remaining as subtitle
  renderLivesDots(lives[idx]);
}

function showIdleCard(){
  var card=document.getElementById('currentCard');
  card.classList.add('idle');
  document.getElementById('idleHint').style.display='';
  ['currentLabel','currentName','livesRow','timerDisplay','timerSub','timerSub2','tapHint','overtimeTag','elimTag'].forEach(function(id){document.getElementById(id).style.display='none';});
}

function renderLivesDots(count){
  var container=document.getElementById('livesRow');
  container.innerHTML='';
  for(var i=0;i<MAX_LIVES;i++){
    var dot=document.createElement('span');
    dot.className='life-dot'+(i>=count?' lost':'');
    dot.textContent='❤';
    container.appendChild(dot);
  }
}

function fmt(s){
  if(s==null)s=0;
  var m=Math.floor(s/60),sec=s%60;
  return m>0?m+"'"+sec+'"':sec+'s';
}

function turnLimit(idx){
  idx=(idx===undefined)?currentIndex:idx;
  if(modeId==='individual')return players[idx].time;
  if(modeId==='accelerate'){var t=players[idx].initial-(round-1)*players[idx].dec;return Math.max(t,players[idx].min);}
  if(modeId==='decelerate'){var t2=players[idx].initial+(round-1)*players[idx].inc;return Math.min(t2,players[idx].max);}
  if(modeId==='personalpool')return 999999;
  if(modeId==='advanced'){var d=players[idx].perturn+(round-1)*players[idx].perround;return Math.min(Math.max(d,players[idx].permint),players[idx].permaxt);}
  return remaining;
}

function isPoolMode(){
  return modeId==='bank'||modeId==='personalpool'||modeId==='advanced';
}

function renderPlayersGrid(){
  var grid=document.getElementById('playersGrid');
  grid.innerHTML='';
  for(var i=0;i<players.length;i++){
    var p=players[i];
    var card=document.createElement('div');
    card.className='p-card';
    card.style.setProperty('--pc',p.color);
    var isActive=(i===currentIndex);
    var isDone=turnsThisRound[i];
    var isElim=eliminated[i];
    if(isElim){card.classList.add('elim');}
    else if(isActive){card.classList.add('active');}
    else if(isDone){card.classList.add('done');}
    else{card.classList.add('waiting');}
    var rightHtml;
    if(isElim){rightHtml='<span class="done-badge">淘汰</span>';}
    else if(isDone){rightHtml='<span class="done-badge">已完成</span>';}
    else if(isActive){rightHtml='<span class="p-card-timer">'+fmt(isPoolMode()?players[i].time:remaining)+'</span>';}
    else{rightHtml='<span class="p-card-timer">—</span>';}
    var livesHtml='';
    for(var j=0;j<MAX_LIVES;j++){livesHtml+='<span class="p-life '+(j<lives[i]?'alive':'dead')+'"></span>';}
    card.innerHTML='<div class="p-card-top"></div><div class="p-card-info"><div class="p-card-name">'+p.name+'</div>'+rightHtml+'</div><div class="p-card-lives">'+livesHtml+'</div>';
    if(!isElim&&!isDone&&!isActive){
      card.onclick=function(idx){return function(e){e.stopPropagation();startPlayerTurn(idx);};}(i);
    }
    grid.appendChild(card);
  }
}

function startPlayerTurn(idx){
  if(eliminated[idx])return;
  if(turnsThisRound[idx])return;
  if(timer)clearInterval(timer);
  gameStarted=true;
  currentIndex=idx;
  if(isPoolMode()){
    remaining=modeId==='advanced'?turnLimit(idx):players[idx].time;
    turnStartTime=Date.now();
    poolDisplay=modeId==='advanced'?players[idx].pool:remaining;
    timedOut=false;
    applyColor(idx);
    renderGame();
    if(modeId==='advanced'){
      // \u8FDB\u9636\u6A21\u5F0F\uFF1A\u6BCF\u56DE\u5408\u5012\u8BA1\uFF0C\u603B\u65F6\u95F4\u6C60\u4E0D\u53D8
      remaining=turnLimit(idx);
      timer=setInterval(function(){
        if(isPaused)return;
        remaining--;
        poolDisplay=Math.max(0,players[idx].pool-Math.floor((Date.now()-turnStartTime)/1000));
        players[idx].time=remaining;
        updateTimerUI();
        if(remaining<=10&&remaining>0){sTick();speakNumber(remaining);}
        if(remaining===10)sWarn();
        if(remaining<=0){clearInterval(timer);onTimeout();}
      },1000);
    }else{
      timer=setInterval(function(){
        if(isPaused)return;
        poolDisplay=Math.max(0,players[idx].time-Math.floor((Date.now()-turnStartTime)/1000));
        updateTimerUI();
      },1000);
    }
    return;
  }
  remaining=turnLimit(idx);
  players[idx].time=remaining;
  timedOut=false;
  applyColor(idx);
  renderGame();
  timer=setInterval(function(){
    if(isPaused)return;
    remaining--;
    players[idx].time=remaining;
    updateTimerUI();
    if(remaining<=10&&remaining>0){sTick();speakNumber(remaining);}
    if(remaining===10)sWarn();
    if(remaining<=0){clearInterval(timer);onTimeout();}
  },1000);
}

function updateTimerUI(){
  var el=document.getElementById('timerDisplay');
  if(currentIndex<0)return;
  var displayTime;
  if(modeId==='advanced'){
    displayTime=remaining; // \u5927\u5B57\uFF1A\u672C\u56DE\u5408\u5269\u4F59
    document.getElementById('timerSub2').style.display='';
    document.getElementById('timerSub2').textContent='\u603B\u65F6\u95F4\u6C60 '+(poolDisplay<0?'0':fmt(poolDisplay));
  }else{
    displayTime=isPoolMode()?poolDisplay:remaining;
    document.getElementById('timerSub2').style.display='none';
  }
  el.textContent=fmt(displayTime);
  el.className='timer-lg '+(displayTime<=10?'timer-d':displayTime<=20?'timer-w':'timer-n');
  var cards=document.querySelectorAll('.p-card');
  if(cards[currentIndex]){
    var t=cards[currentIndex].querySelector('.p-card-timer');
    if(t)t.textContent=fmt(displayTime);
  }
}

function onTimeout(){
  if(timer)clearInterval(timer);
  var idx=currentIndex;
  // \u94F6\u884C/\u4E2A\u4EBA\u6C60\u6A21\u5F0F\uFF1A\u6C60\u8017\u5C3D\u62AC\u5931
  if(modeId==='bank'||modeId==='personalpool'){
    players[idx].time=0;
    lives[idx]--;
    sLifeLost();
    timedOut=true;
    renderLivesDots(lives[idx]);
    document.getElementById('livesRow').style.display='flex';
    if(lives[idx]<=0){
      eliminated[idx]=true;
      turnsThisRound[idx]=true;
      sElim();
      document.getElementById('timerDisplay').textContent='已超时';
      document.getElementById('timerDisplay').className='timer-lg timer-d timeout';
      document.getElementById('timerSub').textContent='生命耗尽，已淘汰';
      document.getElementById('tapHint').textContent='点击继续';
      document.getElementById('tapHint').style.display='';
    }else{
      document.getElementById('timerDisplay').textContent='已超时';
      document.getElementById('timerDisplay').className='timer-lg timer-d timeout';
      document.getElementById('timerSub').textContent='剩余生命 '+lives[idx]+' / '+MAX_LIVES;
      document.getElementById('tapHint').textContent='点击继续';
      document.getElementById('tapHint').style.display='';
    }
    return;
  }
  // \u8FDB\u9636\u6A21\u5F0F\uFF1A\u6BCF\u56DE\u5408\u5012\u8BA1\uFF0C\u62AC\u5931\u540E\u4ECE\u6C60\u6263\u9664
  if(modeId==='advanced'){
    lives[idx]--;
    sLifeLost();
    timedOut=true;
    renderLivesDots(lives[idx]);
    document.getElementById('livesRow').style.display='flex';
    var poolLeft=Math.max(0,players[idx].pool-Math.floor((Date.now()-turnStartTime)/1000));
    document.getElementById('timerDisplay').textContent='已超时';
    document.getElementById('timerDisplay').className='timer-lg timer-d timeout';
    if(lives[idx]<=0){
      eliminated[idx]=true;
      turnsThisRound[idx]=true;
      sElim();
      document.getElementById('timerSub').textContent='生命耗尽，已淘汰';
      document.getElementById('timerSub2').style.display='none';
    }else{
      document.getElementById('timerSub').textContent='剩余生命 '+lives[idx]+' / '+MAX_LIVES;
      document.getElementById('timerSub2').textContent='总时间池 '+fmt(poolLeft);
      document.getElementById('timerSub2').style.display='';
    }
    document.getElementById('tapHint').textContent='点击继续';
    document.getElementById('tapHint').style.display='';
    return;
  }
  // \u9650\u65F6\u56DE\u5408/\u7D2F\u8FDB\u52A0\u901F/\u7D2F\u8FDB\u51CF\u901F
  lives[idx]--;
  sLifeLost();
  timedOut=true;
  renderLivesDots(lives[idx]);
  document.getElementById('livesRow').style.display='flex';
  if(lives[idx]<=0){
    eliminated[idx]=true;
    turnsThisRound[idx]=true;
    sElim();
    document.getElementById('timerDisplay').textContent='已超时';
    document.getElementById('timerDisplay').className='timer-lg timer-d timeout';
    document.getElementById('timerSub').textContent='生命耗尽，已淘汰';
    document.getElementById('tapHint').textContent='点击继续';
    document.getElementById('tapHint').style.display='';
  }else{
    document.getElementById('timerDisplay').textContent='已超时';
    document.getElementById('timerDisplay').className='timer-lg timer-d timeout';
    document.getElementById('timerSub').textContent='剩余生命 '+lives[idx]+' / '+MAX_LIVES;
    document.getElementById('tapHint').textContent='点击继续';
    document.getElementById('tapHint').style.display='';
  }
}

function togglePause(){
  var overlay=document.getElementById('pauseOverlay');
  var btn=document.getElementById('pauseBtn');
  if(!isPaused){
    if(timer){clearInterval(timer);timer=null;}
    pausedAt=modeId==='advanced'?players[currentIndex].time:(isPoolMode()?poolDisplay:remaining);
    isPaused=true;
    overlay.style.display='flex';
    btn.textContent='▶ 继续';
  }else{
    isPaused=false;
    overlay.style.display='none';
    btn.textContent='⏸ 暂停';
    if(modeId!=='advanced') remaining=pausedAt;
    if(isPoolMode()){
      var idx=currentIndex;
      if(modeId==='advanced'){
        // \u8FDB\u9636\u6A21\u5F0F\uFF1A\u91CD\u65B0\u5F00\u59CB\u6BCF\u56DE\u5408\u5012\u8BA1interval
        remaining=players[idx].time;
        var pauseDuration=Math.floor((Date.now()-turnStartTime)/1000);
        turnStartTime=Date.now()-pauseDuration*1000;
        timer=setInterval(function(){
          if(isPaused)return;
          remaining--;
          players[idx].time=remaining;
          updateTimerUI();
          if(remaining<=10&&remaining>0){sTick();speakNumber(remaining);}
          if(remaining===10)sWarn();
          if(remaining<=0){clearInterval(timer);onTimeout();}
        },1000);
      }else{
        var pauseDuration=Math.floor((Date.now()-turnStartTime)/1000);
        turnStartTime=Date.now()-pauseDuration*1000;
        timer=setInterval(function(){
          if(isPaused)return;
          poolDisplay=Math.max(0,players[idx].time-Math.floor((Date.now()-turnStartTime)/1000));
          updateTimerUI();
        },1000);
      }
    }else{
      var idx=currentIndex;
      timer=setInterval(function(){
        if(isPaused)return;
        remaining--;
        players[idx].time=remaining;
        updateTimerUI();
        if(remaining<=10&&remaining>0){sTick();speakNumber(remaining);}
        if(remaining===10)sWarn();
        if(remaining<=0){clearInterval(timer);onTimeout();}
      },1000);
    }
  }
}

function updatePauseBtn(){
  var btn=document.getElementById('pauseBtn');
  if(currentIndex<0||isPaused){btn.style.display='none';}
  else{btn.style.display='';btn.textContent='⏸ 暂停';}
}

function onScreenTap(e){
  if(e.target.closest('button'))return;
  e.stopPropagation();
  var overlay=document.getElementById('pauseOverlay');
  if(overlay.style.display==='flex')return;
  if(currentIndex<0){
    var next=-1;
    for(var i=0;i<players.length;i++){
      var idx=(players.length+i)%players.length;
      if(!eliminated[idx]&&!turnsThisRound[idx]){next=idx;break;}
    }
    if(next>=0){gameStarted=true;startPlayerTurn(next);}
    return;
  }
  if(timedOut){
    timedOut=false;
    finishCurrentTurn();
    return;
  }
  finishCurrentTurn();
}

function finishCurrentTurn(){
  if(timer)clearInterval(timer);
  var finished=currentIndex;
  turnsThisRound[finished]=true;
  if(isPoolMode()){
    var elapsed=Math.floor((Date.now()-turnStartTime)/1000);
    if(modeId==='advanced'){
      // \u8FDB\u9636\u6A21\u5F0F\uFF1A\u4ECE\u6C60\u6263\u9664\u8FC7\u53BB\u65F6\u95F4
      players[finished].pool=Math.max(0,players[finished].pool-elapsed);
      players[finished].time=0;
      if(players[finished].pool<=0){
        lives[finished]--;
        if(lives[finished]<=0){
          eliminated[finished]=true;
          sElim();
        }
      }
    }else{
      players[finished].time=Math.max(0,players[finished].time-elapsed);
      if(players[finished].time<=0){
        lives[finished]--;
        if(lives[finished]<=0){
          eliminated[finished]=true;
          sElim();
        }
      }
    }
    sFinish();
    currentIndex=-1;
    if(checkRoundComplete()){sRoundDone();advanceRound();return;}
    var next2=-1;
    for(var i=0;i<players.length;i++){
      var idx2=(finished+1+i)%players.length;
      if(!eliminated[idx2]&&!turnsThisRound[idx2]){next2=idx2;break;}
    }
    if(next2>=0){startPlayerTurn(next2);}
    else{sRoundDone();advanceRound();}
    return;
  }
  players[finished].time=remaining;
  sFinish();
  var next=-1;
  for(var i=0;i<players.length;i++){
    var idx=(finished+1+i)%players.length;
    if(!eliminated[idx]&&!turnsThisRound[idx]){next=idx;break;}
  }
  currentIndex=-1;
  if(next>=0){startPlayerTurn(next);}
  else if(checkRoundComplete()){sRoundDone();advanceRound();}
}

function checkRoundComplete(){
  for(var i=0;i<players.length;i++){if(!eliminated[i]&&!turnsThisRound[i])return false;}
  return true;
}

function advanceRound(){
  round++;
  for(var j=0;j<players.length;j++)turnsThisRound[j]=false;
  currentIndex=-1;
  timedOut=false;isPaused=false;
  document.getElementById('pauseOverlay').style.display='none';
  if(gameStarted){
    var first=-1;
    for(var k=0;k<players.length;k++){if(!eliminated[k]){first=k;break;}}
    if(first>=0){startPlayerTurn(first);}
    else{renderGame();}
  }else{
    renderGame();
  }
}

function confirmExit(){if(confirm('确定结束游戏？'))endGame();}

function endGame(){
  if(timer)clearInterval(timer);
  isPaused=false;
  document.getElementById('pauseOverlay').style.display='none';
  sOver();
  showScreen('overScreen');
  applyColor(-1);
  document.getElementById('overSub').textContent='共进行了 '+round+' 回合';
  var sorted=[];
  for(var i=0;i<players.length;i++){sorted.push({name:players[i].name,elim:eliminated[i],lostLives:MAX_LIVES-lives[i],time:players[i].time});}
  sorted.sort(function(a,b){if(a.elim!==b.elim)return a.elim?1:-1;return b.time-a.time;});
  var medals=['🥇','🥈','🥉'];
  var list=document.getElementById('resultList');
  list.innerHTML='';
  for(var k=0;k<sorted.length;k++){
    var p=sorted[k];
    var rankEl=document.createElement('div');
    rankEl.className='result-rank rank-'+(k+1);
    rankEl.textContent=medals[k]||'#'+(k+1);
    var item=document.createElement('div');
    item.className='result-item';
    var detail;
    if(p.elim){detail='<div class="result-elim">已淘汰（扣'+p.lostLives+'命）</div>';}
    else{detail='<div class="result-detail">剩余 '+fmt(p.time)+' · 扣'+p.lostLives+'命</div>';}
    item.innerHTML='<div class="result-info"><div class="result-name">'+p.name+'</div>'+detail+'</div>';
    item.insertBefore(rankEl,item.firstChild);
    list.appendChild(item);
  }
}

function playAgain(){showScreen('setupScreen');}

function toggleSound(e){
  e.stopPropagation();
  soundOn=!soundOn;
  var btn=document.getElementById('soundToggle');
  btn.textContent=soundOn?'🔔':'🔕';
  btn.classList.toggle('on',soundOn);
}

renderSetup();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
