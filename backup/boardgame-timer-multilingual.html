<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title data-i18n="title">Board Game Timer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0f0f1a;--card:#1a1a2e;--border:#2a2a3e;--primary:#00d4ff;--secondary:#7b2ff7;
--text:#fff;--text-dim:#666;--warn:#ffaa00;--danger:#ff4757;--success:#6BCB77
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.btn-fixed{position:fixed;top:14px;width:38px;height:38px;border-radius:50%;background:rgba(15,15,26,.8);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-size:16px;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.btn-fixed:hover{border-color:rgba(255,255,255,.3)}
#langToggle{right:60px;font-size:11px;font-weight:700}
#langToggle.on{color:var(--primary)}
#langMenu{position:fixed;top:60px;right:14px;z-index:300;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#langMenu.show{display:block}
.lang-item{padding:10px 16px;font-size:13px;color:#aaa;cursor:pointer;transition:background .2s}
.lang-item:hover{background:var(--border)}
.lang-item.selected{color:var(--primary)}
#soundToggle{right:14px}
#soundToggle.on{color:var(--text)}
.screen{display:none;padding:20px;max-width:480px;margin:0 auto}
.screen.active{display:block}
.title{text-align:center;font-size:26px;font-weight:800;margin:28px 0 6px;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:28px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.mode-card{background:var(--card);border-radius:16px;padding:16px 14px;border:2px solid var(--border);cursor:pointer;transition:all .2s;text-align:center}
.mode-card:active{transform:scale(.97)}
.mode-card.selected{border-color:var(--primary);background:rgba(0,212,255,.07)}
.mode-icon{font-size:28px;margin-bottom:6px}
.mode-name{font-size:14px;font-weight:700;margin-bottom:4px}
.mode-desc{font-size:11px;color:var(--text-dim);line-height:1.4}
.form-group{margin-bottom:18px}
.form-label{font-size:13px;color:#888;margin-bottom:8px;display:block}
.form-row{display:flex;gap:10px;align-items:center}
.num-input{width:70px;height:44px;border-radius:10px;border:1px solid #333;background:var(--card);color:var(--text);font-size:18px;text-align:center;outline:none}
.num-input:focus{border-color:var(--primary)}
.time-unit{color:var(--text-dim);font-size:12px}
.player-names-list{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.name-input{height:40px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;padding:0 12px;outline:none;transition:border .2s}
.name-input:focus{border-color:var(--primary)}
.mode-settings{background:#14142a;border-radius:14px;padding:14px;margin-bottom:18px}
.mode-settings-title{font-size:12px;color:#555;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.setting-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.setting-row:last-child{margin-bottom:0}
.setting-label{font-size:13px;color:#aaa;min-width:90px}
.start-btn{width:100%;height:54px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--primary),var(--secondary));color:var(--text);font-size:17px;font-weight:700;cursor:pointer;margin-top:10px;transition:opacity .2s}
.start-btn:active{opacity:.8}
#gameScreen{position:relative;cursor:pointer;user-select:none;padding:0;max-width:100%}
.game-inner{padding:14px 16px;max-width:480px;margin:0 auto;position:relative;z-index:1}
.game-bg{position:fixed;inset:0;z-index:0;background:var(--gc,var(--bg));transition:background .6s ease}
.game-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--pc) 18%,transparent),transparent 70%)}
.game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative;z-index:2}
.round-badge{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 14px;font-size:12px;color:rgba(255,255,255,.6)}
.round-badge span{font-weight:700;color:var(--pc)}
.exit-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 14px;color:rgba(255,255,255,.4);font-size:12px;cursor:pointer;position:relative;z-index:2}
.round-progress{display:flex;gap:6px;justify-content:center;margin-bottom:16px;position:relative;z-index:2}
.round-dot{width:10px;height:10px;border-radius:50%;background:#333;transition:all .3s}
.round-dot.done{background:var(--pc);box-shadow:0 0 6px var(--pc)}
.round-dot.active{background:var(--pc);box-shadow:0 0 10px var(--pc);transform:scale(1.3)}
.current-card{border-radius:24px;padding:24px 20px;margin-bottom:14px;position:relative;z-index:2;text-align:center;background:color-mix(in srgb,var(--pc) 8%,var(--card));border:2px solid color-mix(in srgb,var(--pc) 30%,transparent);transition:all .3s}
.current-card.idle{background:var(--card);border-color:var(--border)}
.current-label{font-size:11px;text-transform:uppercase;letter-spacing:3px;color:var(--pc);margin-bottom:4px;opacity:.7}
.current-label.idle{color:#555}
.current-name{font-size:26px;font-weight:800;margin-bottom:8px;color:var(--pc)}
.lives-row{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.life-dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:var(--pc);color:#000;box-shadow:0 0 10px color-mix(in srgb,var(--pc) 60%,transparent);transition:all .3s}
.life-dot.lost{background:var(--border);color:#444;box-shadow:none}
.timer-lg{font-size:76px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-3px;line-height:1;margin-bottom:6px;transition:color .3s}
.timer-lg.timeout{font-size:56px}
.timer-n{color:var(--text)}
.timer-w{color:var(--warn)}
.timer-d{color:var(--danger)}
.timer-sub{font-size:18px;color:rgba(255,255,255,.7);margin-bottom:8px;min-height:22px;font-weight:600}
#timerSub2{font-size:22px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:1px}
.tap-hint{font-size:16px;color:rgba(255,255,255,.5);margin-top:14px;font-weight:600}
.idle-hint{font-size:15px;padding:20px 0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overtime-tag{display:inline-block;background:color-mix(in srgb,var(--pc) 20%,transparent);border:1px solid var(--pc);color:var(--pc);font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;margin-bottom:8px}
.elim-tag{display:inline-block;background:var(--danger);color:var(--text);font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;margin-top:8px}
.players-grid{display:grid;gap:8px;position:relative;z-index:2}
.p-card{border-radius:14px;padding:14px 16px;background:color-mix(in srgb,var(--gc) 70%,transparent);border:2px solid color-mix(in srgb,var(--pc) 12%,transparent);cursor:pointer;transition:all .2s;position:relative}
.p-card:active{transform:scale(.98)}
.p-card.active{border-color:color-mix(in srgb,var(--pc) 60%,transparent);background:color-mix(in srgb,var(--pc) 15%,var(--card))}
.p-card.done{opacity:.5;cursor:default;pointer-events:none}
.p-card.elim{opacity:.3;cursor:default;pointer-events:none}
.p-card.waiting{cursor:pointer}
.p-card-top{height:4px;border-radius:2px;margin-bottom:10px;background:var(--pc);opacity:.4}
.p-card.active .p-card-top{opacity:1}
.p-card-info{display:flex;align-items:center;gap:10px}
.p-card-name{font-size:15px;font-weight:700;flex:1}
.p-card.active .p-card-name{color:var(--pc)}
.p-card-timer{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.5)}
.p-card.active .p-card-timer{color:var(--pc)}
.p-card-lives{display:flex;gap:3px;margin-top:6px}
.p-life{width:9px;height:9px;border-radius:50%}
.p-life.alive{background:var(--pc)}
.p-life.dead{background:#333}
.done-badge{font-size:11px;color:rgba(255,255,255,.3)}
.over-title{font-size:30px;font-weight:800;text-align:center;margin:40px 0 6px;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.over-sub{text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:30px}
.result-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.result-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px 16px}
.result-rank{font-size:22px;font-weight:800;width:32px}
.rank-1{color:#ffd700}
.rank-2{color:#c0c0c0}
.rank-3{color:#cd7f32}
.result-info{flex:1}
.result-name{font-size:15px;font-weight:600}
.result-detail{font-size:12px;color:var(--text-dim);margin-top:2px}
.result-elim{font-size:12px;color:var(--danger)}
.restart-btn{width:100%;height:54px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--primary),var(--secondary));color:var(--text);font-size:16px;font-weight:700;cursor:pointer}
#pauseOverlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.85);align-items:center;justify-content:center;flex-direction:column;gap:20px}
#pauseOverlay .pause-text{font-size:52px;font-weight:800;color:var(--text)}
#pauseOverlay .resume-btn{padding:14px 40px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--primary),var(--secondary));color:var(--text);font-size:20px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<button class="btn-fixed on" id="langToggle" data-i18n-title="switchLang">中</button>
<div id="langMenu" class="lang-menu"></div>
<button class="btn-fixed on" id="soundToggle" data-i18n-title="toggleSound">🔔</button>

<div class="screen active" id="setupScreen">
<h1 class="title">🎲 <span data-i18n="mainTitle">Board Game Timer</span></h1>
<p class="subtitle" data-i18n="mainSubtitle">Select mode → Set players → Start game</p>
<div class="form-group">
<label class="form-label" data-i18n="modeLabel">Timer Mode</label>
<div class="mode-grid" id="modeGrid"></div>
</div>
<div id="modeSettings" class="mode-settings">
<div class="mode-settings-title" id="modeSettingsTitle"></div>
<div id="modeSettingsBody"></div>
</div>
<div class="form-group">
<label class="form-label" data-i18n="playerCount">Number of Players</label>
<div class="form-row">
<input type="number" class="num-input" id="playerCountInput" value="4" min="1">
<span class="time-unit" data-i18n="players">players</span>
</div>
</div>
<div class="form-group">
<label class="form-label" data-i18n="playerNames">Player Names (optional)</label>
<div class="player-names-list" id="playerNamesList"></div>
</div>
<button class="start-btn" id="startBtn" data-i18n="startGame">Start Game</button>
</div>

<div class="screen" id="gameScreen" onclick="Game.onScreenTap(event)">
<div class="game-bg" id="gameBg"></div>
<div class="game-inner">
<div class="game-header">
<div class="round-badge"><span data-i18n="round">Round</span> <span id="roundNum">1</span></div>
<div style="display:flex;gap:8px">
<button class="exit-btn" id="pauseBtn" data-i18n="pause">⏸ Pause</button>
<button class="exit-btn" id="exitBtn" data-i18n="endGame">End</button>
</div>
</div>
<div class="round-progress" id="roundProgress"></div>
<div class="current-card idle" id="currentCard">
<div class="idle-hint" id="idleHint">
<span class="hint-text" data-i18n="idleHint1">Tap</span>
<span style="font-size:22px;font-weight:800;color:#FFD93D" data-i18n="idleHint2">Anywhere</span>
<span class="hint-text" data-i18n="idleHint3">or</span>
<span style="font-size:22px;font-weight:800;color:#4ECDC4" data-i18n="idleHint4">Player Card</span>
<span class="hint-text" data-i18n="idleHint5">to start</span>
</div>
<div class="current-label idle" id="currentLabel" style="display:none" data-i18n="currentTiming">Current Timing</div>
<div class="current-name" id="currentName" style="display:none"></div>
<div class="lives-row" id="livesRow" style="display:none"></div>
<div class="overtime-tag" id="overtimeTag" style="display:none" data-i18n="overtime">⏸ Overtime</div>
<div class="timer-lg timer-n" id="timerDisplay" style="display:none">60</div>
<div class="timer-sub" id="timerSub" style="display:none"></div>
<div class="timer-sub" id="timerSub2" style="display:none;font-size:20px;font-weight:700;color:rgba(255,255,255,.65)"></div>
<div class="elim-tag" id="elimTag" style="display:none">💀 <span data-i18n="eliminated">Eliminated</span></div>
<div class="tap-hint" id="tapHint" style="display:none" data-i18n="tapToContinue">Tap to continue</div>
</div>
<div class="players-grid" id="playersGrid"></div>
</div>
</div>

<div id="pauseOverlay">
<div class="pause-text">⏸ <span data-i18n="paused">Paused</span></div>
<button class="resume-btn" id="resumeBtn" data-i18n="resume">Resume ▶</button>
</div>

<div class="screen" id="overScreen">
<h1 class="over-title">🏆 <span data-i18n="gameOver">Game Over</span></h1>
<p class="over-sub" id="overSub"></p>
<div class="result-list" id="resultList"></div>
<button class="restart-btn" id="restartBtn" data-i18n="playAgain">Play Again</button>
</div>

const PALETTE = ['#FF6B6B', '#4ECDC4', '#FFD93D', '#6BCB77', '#4D96FF', '#FF9F43', '#A29BFE', '#FD79A8'];
const MAX_LIVES = 3;

const $ = id => document.getElementById(id);

class AudioManager {
  constructor() {
    this.enabled = true;
    this.ctx = null;
    this.voice = null;
    this.initVoice();
  }
  initVoice() {
    try {
      const voices = speechSynthesis.getVoices();
      const langMap = { zh: 'zh', en: 'en', fr: 'fr', ko: 'ko', ja: 'ja' };
      const targetLang = langMap[I18n.currentLang] || 'en';
      const filtered = voices.filter(v => v.lang.includes(targetLang));
      if (targetLang === 'zh') {
        this.voice = filtered.find(v => /female|girl|女/i.test(v.name)) || filtered[0];
      } else {
        this.voice = filtered[0];
      }
      speechSynthesis.onvoiceschanged = () => {
        const newVoices = speechSynthesis.getVoices();
        const newFiltered = newVoices.filter(v => v.lang.includes(targetLang));
        if (targetLang === 'zh') {
          this.voice = newFiltered.find(v => /female|girl|女/i.test(v.name)) || newFiltered[0];
        } else {
          this.voice = newFiltered[0];
        }
      };
    } catch (e) {}
  }
  getContext() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    return this.ctx;
  }
  beep(freq, dur, type = 'sine', vol = 0.12) {
    if (!this.enabled) return;
    try {
      const ctx = this.getContext();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g);
      g.connect(ctx.destination);
      o.frequency.value = freq;
      o.type = type;
      g.gain.setValueAtTime(vol, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      o.start();
      o.stop(ctx.currentTime + dur);
    } catch (e) {}
  }
  tick() { this.beep(900, 0.07); }
  warn() { this.beep(550, 0.18, 'square'); }
  finish() { this.beep(1300, 0.1); setTimeout(() => this.beep(1700, 0.15), 80); }
  elim() { this.beep(280, 0.35, 'sawtooth'); }
  lifeLost() { this.beep(400, 0.15); setTimeout(() => this.beep(200, 0.3, 'sawtooth'), 150); }
  roundDone() { [600, 800, 1000].forEach((f, i) => setTimeout(() => this.beep(f, 0.15), i * 80)); }
  gameOver() { [380, 480, 580, 780].forEach((f, i) => setTimeout(() => this.beep(f, 0.2), i * 110)); }
  speak(n) {
    if (!this.enabled) return;
    try {
      const utt = new SpeechSynthesisUtterance(String(n));
      const langMap = { zh: 'zh-CN', en: 'en-US', fr: 'fr-FR', ko: 'ko-KR', ja: 'ja-JP' };
      utt.lang = langMap[I18n.currentLang] || 'en-US';
      utt.volume = 0.9;
      utt.rate = 1.3;
      if (this.voice) utt.voice = this.voice;
      speechSynthesis.cancel();
      speechSynthesis.speak(utt);
    } catch (e) {}
  }
  toggle() {
    this.enabled = !this.enabled;
    return this.enabled;
  }
}

const Audio = new AudioManager();

class Game {
  constructor() {
    this.modeId = 'individual';
    this.playerCount = 4;
    this.players = [];
    this.currentIndex = -1;
    this.round = 1;
    this.timer = null;
    this.remaining = 0;
    this.eliminated = {};
    this.lives = {};
    this.turnsThisRound = {};
    this.timedOut = false;
    this.isPaused = false;
    this.pausedAt = 0;
    this.turnStartTime = 0;
    this.poolDisplay = 0;
    this.gameStarted = false;
    this.root = document.documentElement;
  }

  static isPoolMode(mode) {
    return ['bank', 'personalpool', 'advanced'].includes(mode);
  }

  fmt(s) {
    if (s == null) s = 0;
    const m = Math.floor(s / 60);
    const sec = s % 60;
    const t = I18n.t;
    return m > 0 ? `${m}${I18n.currentLang === 'zh' ? "'" : "m "}${sec}${I18n.currentLang === 'zh' ? '"' : "s"}` : `${sec}${I18n.currentLang === 'zh' ? 's' : 's'}`;
  }

  getModeTimeLimit(idx) {
    const p = this.players[idx];
    switch (this.modeId) {
      case 'individual': return p.time;
      case 'accelerate': return Math.max(p.initial - (this.round - 1) * p.dec, p.min);
      case 'decelerate': return Math.min(p.initial + (this.round - 1) * p.inc, p.max);
      case 'personalpool': return 999999;
      case 'advanced':
        const d = p.perturn + (this.round - 1) * p.perround;
        return Math.min(Math.max(d, p.permint), p.permaxt);
      default: return this.remaining;
    }
  }

  initPlayers() {
    const ms = this.getModeSettings();
    this.players = [];
    const nameInputs = document.querySelectorAll('.name-input');
    for (let i = 0; i < this.playerCount; i++) {
      const name = (nameInputs[i] && nameInputs[i].value.trim()) || `${I18n.t('player')} ${i + 1}`;
      const color = PALETTE[i % PALETTE.length];
      const p = { name, color };
      switch (this.modeId) {
        case 'individual': p.time = ms.time || 60; p.initial = ms.time || 60; break;
        case 'bank': p.time = (ms.pool || 10) * 60; p.pool = (ms.pool || 10) * 60; break;
        case 'accelerate': p.time = ms.start || 60; p.initial = ms.start || 60; p.dec = ms.dec || 5; p.min = ms.min || 15; break;
        case 'decelerate': p.time = ms.start || 5; p.initial = ms.start || 5; p.inc = ms.inc || 5; p.max = (ms.max || 3) * 60; break;
        case 'personalpool': p.time = (ms.total || 5) * 60; p.pool = (ms.total || 5) * 60; break;
        case 'advanced': p.time = (ms.pertotal || 6) * 60; p.pool = (ms.pertotal || 6) * 60; p.perturn = ms.perturn || 60; p.perround = ms.perround || 0; p.permaxt = (ms.permaxt || 3) * 60; p.permint = 15; break;
      }
      this.players.push(p);
    }
    this.lives = {}; this.eliminated = {}; this.turnsThisRound = {};
    for (let j = 0; j < this.players.length; j++) {
      this.lives[j] = MAX_LIVES;
      this.eliminated[j] = false;
      this.turnsThisRound[j] = false;
    }
  }

  getModeSettings() {
    const m = MODES.find(x => x.id === this.modeId);
    const result = {};
    m.settings.forEach(s => {
      const el = $(`ms_${s.key}`);
      result[s.key] = el ? (parseInt(el.value) || s.def) : s.def;
    });
    return result;
  }

  start() {
    this.playerCount = Math.max(1, parseInt($('playerCountInput').value) || 1);
    this.initPlayers();
    this.currentIndex = -1;
    this.round = 1;
    this.timedOut = false;
    this.isPaused = false;
    this.gameStarted = false;
    if (this.timer) clearInterval(this.timer);
    $('pauseOverlay').style.display = 'none';
    this.showScreen('gameScreen');
    this.applyColor(-1);
    this.render();
  }

  showScreen(id) {
    ['setupScreen', 'gameScreen', 'overScreen'].forEach(s => {
      $(s).classList.toggle('active', s === id);
    });
  }

  applyColor(idx) {
    const c = idx >= 0 && this.players[idx] ? this.players[idx].color : PALETTE[0];
    this.root.style.setProperty('--pc', c);
    this.root.style.setProperty('--gc', '#0f0f1a');
  }

  render() {
    $('roundNum').textContent = this.round;
    this.applyColor(this.currentIndex);
    this.renderRoundProgress();
    this.renderPlayersGrid();
    if (this.currentIndex >= 0) this.showActiveCard();
    else this.showIdleCard();
    this.updatePauseBtn();
  }

  renderRoundProgress() {
    const container = $('roundProgress');
    container.innerHTML = '';
    for (let i = 0; i < this.players.length; i++) {
      const dot = document.createElement('div');
      dot.className = 'round-dot';
      if (this.eliminated[i]) dot.style.background = '#ff4757';
      else if (this.turnsThisRound[i]) dot.classList.add('done');
      else if (i === this.currentIndex) dot.classList.add('active');
      container.appendChild(dot);
    }
  }

  showActiveCard() {
    const card = $('currentCard');
    card.classList.remove('idle');
    $('idleHint').style.display = 'none';
    ['currentLabel', 'currentName', 'livesRow', 'timerDisplay', 'timerSub', 'tapHint'].forEach(id => $(id).style.display = '');
    $('currentLabel').classList.remove('idle');
    $('currentName').textContent = this.players[this.currentIndex].name;
    $('elimTag').style.display = this.eliminated[this.currentIndex] ? '' : 'none';
    $('overtimeTag').style.display = 'none';
    $('timerDisplay').className = 'timer-lg timer-n';
    $('timerDisplay').textContent = this.remaining;
    $('timerSub').textContent = '';
    this.renderLivesDots(this.lives[this.currentIndex]);
  }

  showIdleCard() {
    const card = $('currentCard');
    card.classList.add('idle');
    $('idleHint').style.display = '';
    ['currentLabel', 'currentName', 'livesRow', 'timerDisplay', 'timerSub', 'timerSub2', 'tapHint', 'overtimeTag', 'elimTag'].forEach(id => $(id).style.display = 'none');
  }

  renderLivesDots(count) {
    const container = $('livesRow');
    container.innerHTML = '';
    for (let i = 0; i < MAX_LIVES; i++) {
      const dot = document.createElement('span');
      dot.className = `life-dot${i >= count ? ' lost' : ''}`;
      dot.textContent = '❤';
      container.appendChild(dot);
    }
  }

  renderPlayersGrid() {
    const grid = $('playersGrid');
    grid.innerHTML = '';
    const isPool = Game.isPoolMode(this.modeId);
    for (let i = 0; i < this.players.length; i++) {
      const p = this.players[i];
      const card = document.createElement('div');
      card.className = 'p-card';
      card.style.setProperty('--pc', p.color);
      const isActive = i === this.currentIndex;
      const isDone = this.turnsThisRound[i];
      const isElim = this.eliminated[i];
      if (isElim) card.classList.add('elim');
      else if (isActive) card.classList.add('active');
      else if (isDone) card.classList.add('done');
      else card.classList.add('waiting');
      let rightHtml;
      if (isElim) rightHtml = `<span class="done-badge">${I18n.t('eliminated_short')}</span>`;
      else if (isDone) rightHtml = `<span class="done-badge">${I18n.t('done')}</span>`;
      else if (isActive) rightHtml = `<span class="p-card-timer">${this.fmt(isPool ? this.players[i].time : this.remaining)}</span>`;
      else rightHtml = '<span class="p-card-timer">—</span>';
      let livesHtml = '';
      for (let j = 0; j < MAX_LIVES; j++) livesHtml += `<span class="p-life ${j < this.lives[i] ? 'alive' : 'dead'}"></span>`;
      card.innerHTML = `<div class="p-card-top"></div><div class="p-card-info"><div class="p-card-name">${p.name}</div>${rightHtml}</div><div class="p-card-lives">${livesHtml}</div>`;
      if (!isElim && !isDone && !isActive) {
        card.onclick = e => { e.stopPropagation(); this.startPlayerTurn(i); };
      }
      grid.appendChild(card);
    }
  }

  startPlayerTurn(idx) {
    if (this.eliminated[idx] || this.turnsThisRound[idx]) return;
    if (this.timer) clearInterval(this.timer);
    this.gameStarted = true;
    this.currentIndex = idx;
    const isPool = Game.isPoolMode(this.modeId);
    if (isPool) {
      this.remaining = this.modeId === 'advanced' ? this.getModeTimeLimit(idx) : this.players[idx].time;
      this.turnStartTime = Date.now();
      this.poolDisplay = this.modeId === 'advanced' ? this.players[idx].pool : this.remaining;
      this.timedOut = false;
      this.applyColor(idx);
      this.render();
      if (this.modeId === 'advanced') {
        this.timer = setInterval(() => this.tickAdvanced(), 1000);
      } else {
        this.timer = setInterval(() => this.tickPool(), 1000);
      }
      return;
    }
    this.remaining = this.getModeTimeLimit(idx);
    this.players[idx].time = this.remaining;
    this.timedOut = false;
    this.applyColor(idx);
    this.render();
    this.timer = setInterval(() => this.tickStandard(), 1000);
  }

  tickStandard() {
    if (this.isPaused) return;
    this.remaining--;
    this.players[this.currentIndex].time = this.remaining;
    this.updateTimerUI();
    if (this.remaining <= 10 && this.remaining > 0) { Audio.tick(); Audio.speak(this.remaining); }
    if (this.remaining === 10) Audio.warn();
    if (this.remaining <= 0) { clearInterval(this.timer); this.onTimeout(); }
  }

  tickPool() {
    if (this.isPaused) return;
    this.poolDisplay = Math.max(0, this.players[this.currentIndex].time - Math.floor((Date.now() - this.turnStartTime) / 1000));
    this.updateTimerUI();
  }

  tickAdvanced() {
    if (this.isPaused) return;
    this.remaining--;
    this.poolDisplay = Math.max(0, this.players[this.currentIndex].pool - Math.floor((Date.now() - this.turnStartTime) / 1000));
    this.players[this.currentIndex].time = this.remaining;
    this.updateTimerUI();
    if (this.remaining <= 10 && this.remaining > 0) { Audio.tick(); Audio.speak(this.remaining); }
    if (this.remaining === 10) Audio.warn();
    if (this.remaining <= 0) { clearInterval(this.timer); this.onTimeout(); }
  }

  updateTimerUI() {
    const el = $('timerDisplay');
    if (this.currentIndex < 0) return;
    let displayTime;
    if (this.modeId === 'advanced') {
      displayTime = this.remaining;
      $('timerSub2').style.display = '';
      $('timerSub2').textContent = `${I18n.t('totalPool')} ${this.poolDisplay < 0 ? '0' : this.fmt(this.poolDisplay)}`;
    } else {
      displayTime = Game.isPoolMode(this.modeId) ? this.poolDisplay : this.remaining;
      $('timerSub2').style.display = 'none';
    }
    el.textContent = this.fmt(displayTime);
    el.className = `timer-lg ${displayTime <= 10 ? 'timer-d' : displayTime <= 20 ? 'timer-w' : 'timer-n'}`;
    const cards = document.querySelectorAll('.p-card');
    if (cards[this.currentIndex]) {
      const t = cards[this.currentIndex].querySelector('.p-card-timer');
      if (t) t.textContent = this.fmt(displayTime);
    }
  }

  onTimeout() {
    if (this.timer) clearInterval(this.timer);
    const idx = this.currentIndex;
    const isPoolMode = Game.isPoolMode(this.modeId);
    this.lives[idx]--;
    Audio.lifeLost();
    this.timedOut = true;
    this.renderLivesDots(this.lives[idx]);
    $('livesRow').style.display = 'flex';
    $('timerDisplay').textContent = I18n.currentLang === 'zh' ? '已超时' : 'Overtime';
    $('timerDisplay').className = 'timer-lg timer-d timeout';
    if (this.lives[idx] <= 0) {
      this.eliminated[idx] = true;
      this.turnsThisRound[idx] = true;
      Audio.elim();
      $('timerSub').textContent = I18n.currentLang === 'zh' ? '生命耗尽，已淘汰' : 'No lives left, eliminated';
      if (this.modeId === 'advanced') $('timerSub2').style.display = 'none';
    } else {
      $('timerSub').textContent = `${I18n.t('livesLeft')} ${this.lives[idx]} / ${MAX_LIVES}`;
      if (this.modeId === 'advanced') {
        const poolLeft = Math.max(0, this.players[idx].pool - Math.floor((Date.now() - this.turnStartTime) / 1000));
        $('timerSub2').textContent = `${I18n.t('totalPool')} ${this.fmt(poolLeft)}`;
        $('timerSub2').style.display = '';
      }
    }
    $('tapHint').textContent = I18n.t('tapToContinue');
    $('tapHint').style.display = '';
  }

  togglePause() {
    const overlay = $('pauseOverlay');
    const btn = $('pauseBtn');
    if (!this.isPaused) {
      if (this.timer) { clearInterval(this.timer); this.timer = null; }
      this.pausedAt = this.modeId === 'advanced' ? this.players[this.currentIndex].time : (Game.isPoolMode(this.modeId) ? this.poolDisplay : this.remaining);
      this.isPaused = true;
      overlay.style.display = 'flex';
      btn.textContent = `▶ ${I18n.t('resume').split(' ')[0]}`;
    } else {
      this.isPaused = false;
      overlay.style.display = 'none';
      btn.textContent = `⏸ ${I18n.t('pause').split(' ')[1]}`;
      if (this.modeId !== 'advanced') this.remaining = this.pausedAt;
      const idx = this.currentIndex;
      if (Game.isPoolMode(this.modeId)) {
        const pauseDuration = Math.floor((Date.now() - this.turnStartTime) / 1000);
        this.turnStartTime = Date.now() - pauseDuration * 1000;
        if (this.modeId === 'advanced') {
          this.timer = setInterval(() => this.tickAdvanced(), 1000);
        } else {
          this.timer = setInterval(() => this.tickPool(), 1000);
        }
      } else {
        this.timer = setInterval(() => this.tickStandard(), 1000);
      }
    }
  }

  updatePauseBtn() {
    const btn = $('pauseBtn');
    if (this.currentIndex < 0 || this.isPaused) btn.style.display = 'none';
    else { btn.style.display = ''; btn.textContent = `⏸ ${I18n.t('pause').split(' ')[1]}`; }
  }

  onScreenTap(e) {
    if (e.target.closest('button')) return;
    e.stopPropagation();
    const overlay = $('pauseOverlay');
    if (overlay.style.display === 'flex') return;
    if (this.currentIndex < 0) {
      const next = this.findNextPlayer(-1);
      if (next >= 0) { this.gameStarted = true; this.startPlayerTurn(next); }
      return;
    }
    if (this.timedOut) {
      this.timedOut = false;
      this.finishTurn();
      return;
    }
    this.finishTurn();
  }

  findNextPlayer(from) {
    for (let i = 0; i < this.players.length; i++) {
      const idx = (this.players.length + from + 1 + i) % this.players.length;
      if (!this.eliminated[idx] && !this.turnsThisRound[idx]) return idx;
    }
    return -1;
  }

  finishTurn() {
    if (this.timer) clearInterval(this.timer);
    const finished = this.currentIndex;
    this.turnsThisRound[finished] = true;
    const isPool = Game.isPoolMode(this.modeId);
    if (isPool) {
      const elapsed = Math.floor((Date.now() - this.turnStartTime) / 1000);
      if (this.modeId === 'advanced') {
        this.players[finished].pool = Math.max(0, this.players[finished].pool - elapsed);
        this.players[finished].time = 0;
        if (this.players[finished].pool <= 0) {
          this.lives[finished]--;
          if (this.lives[finished] <= 0) { this.eliminated[finished] = true; Audio.elim(); }
        }
      } else {
        this.players[finished].time = Math.max(0, this.players[finished].time - elapsed);
        if (this.players[finished].time <= 0) {
          this.lives[finished]--;
          if (this.lives[finished] <= 0) { this.eliminated[finished] = true; Audio.elim(); }
        }
      }
      Audio.finish();
      this.currentIndex = -1;
      if (this.checkRoundComplete()) { Audio.roundDone(); this.advanceRound(); return; }
      const next = this.findNextPlayer(finished);
      if (next >= 0) this.startPlayerTurn(next);
      else { Audio.roundDone(); this.advanceRound(); }
      return;
    }
    this.players[finished].time = this.remaining;
    Audio.finish();
    this.currentIndex = -1;
    const next = this.findNextPlayer(finished);
    if (next >= 0) this.startPlayerTurn(next);
    else if (this.checkRoundComplete()) { Audio.roundDone(); this.advanceRound(); }
  }

  checkRoundComplete() {
    for (let i = 0; i < this.players.length; i++) {
      if (!this.eliminated[i] && !this.turnsThisRound[i]) return false;
    }
    return true;
  }

  advanceRound() {
    this.round++;
    for (let j = 0; j < this.players.length; j++) this.turnsThisRound[j] = false;
    this.currentIndex = -1;
    this.timedOut = false;
    this.isPaused = false;
    $('pauseOverlay').style.display = 'none';
    if (this.gameStarted) {
      const first = this.players.findIndex((_, i) => !this.eliminated[i]);
      if (first >= 0) this.startPlayerTurn(first);
      else this.render();
    } else {
      this.render();
    }
  }

  confirmExit() {
    if (confirm(I18n.t('confirmEnd'))) this.endGame();
  }

  endGame() {
    if (this.timer) clearInterval(this.timer);
    this.isPaused = false;
    $('pauseOverlay').style.display = 'none';
    Audio.gameOver();
    this.showScreen('overScreen');
    this.applyColor(-1);
    const roundText = I18n.currentLang === 'zh'
      ? `共进行了 ${this.round} 回合`
      : `${I18n.t('roundsPlayed')}: ${this.round}`;
    $('overSub').textContent = roundText;
    const sorted = [];
    for (let i = 0; i < this.players.length; i++) {
      sorted.push({ name: this.players[i].name, elim: this.eliminated[i], lostLives: MAX_LIVES - this.lives[i], time: this.players[i].time });
    }
    sorted.sort((a, b) => {
      if (a.elim !== b.elim) return a.elim ? 1 : -1;
      return b.time - a.time;
    });
    const medals = ['🥇', '🥈', '🥉'];
    const list = $('resultList');
    list.innerHTML = '';
    for (let k = 0; k < sorted.length; k++) {
      const p = sorted[k];
      const rankEl = document.createElement('div');
      rankEl.className = `result-rank rank-${k + 1}`;
      rankEl.textContent = medals[k] || `#${k + 1}`;
      const item = document.createElement('div');
      item.className = 'result-item';
      const detail = p.elim
        ? `<div class="result-elim">${I18n.t('eliminatedNote')} (${I18n.t('livesLost')}${p.lostLives})</div>`
        : `<div class="result-detail">${I18n.t('remaining')} ${this.fmt(p.time)} · ${I18n.t('livesLost')}${p.lostLives}</div>`;
      item.innerHTML = `<div class="result-info"><div class="result-name">${p.name}</div>${detail}</div>`;
      item.insertBefore(rankEl, item.firstChild);
      list.appendChild(item);
    }
  }

  playAgain() {
    this.showScreen('setupScreen');
  }
}

const GameInstance = new Game();

const App = {
  modeId: 'individual',
  playerCount: 4,

  init() {
    this.bindEvents();
    this.buildLangMenu();
    this.renderSetup();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  },

  bindEvents() {
    $('playerCountInput').addEventListener('input', () => this.onPlayerCountChange());
    $('startBtn').addEventListener('click', () => this.startGame());
    $('pauseBtn').addEventListener('click', () => GameInstance.togglePause());
    $('exitBtn').addEventListener('click', () => GameInstance.confirmExit());
    $('resumeBtn').addEventListener('click', () => GameInstance.togglePause());
    $('restartBtn').addEventListener('click', () => GameInstance.playAgain());
    $('soundToggle').addEventListener('click', e => this.toggleSound(e));
    $('langToggle').addEventListener('click', e => this.toggleLang(e));
    document.addEventListener('click', e => {
      if (!e.target.closest('#langToggle') && !e.target.closest('#langMenu')) {
        $('langMenu').classList.remove('show');
      }
    });
  },

  buildLangMenu() {
    const menu = $('langMenu');
    menu.innerHTML = '';
    I18n.supportedLangs.forEach(lang => {
      const item = document.createElement('div');
      item.className = 'lang-item' + (lang === I18n.currentLang ? ' selected' : '');
      item.textContent = I18n.langNames[lang];
      item.onclick = () => this.selectLang(lang);
      menu.appendChild(item);
    });
  },

  selectLang(lang) {
    I18n.setLang(lang);
    $('langToggle').textContent = I18n.langNames[lang].charAt(0).toUpperCase();
    $('langToggle').classList.toggle('on', lang === 'zh');
    this.buildLangMenu();
    this.renderSetup();
    $('langMenu').classList.remove('show');
  },

  toggleSound(e) {
    e.stopPropagation();
    const btn = $('soundToggle');
    const enabled = Audio.toggle();
    btn.textContent = enabled ? '🔔' : '🔕';
    btn.classList.toggle('on', enabled);
  },

  toggleLang(e) {
    e.stopPropagation();
    $('langMenu').classList.toggle('show');
  },

  renderSetup() {
    const grid = $('modeGrid');
    grid.innerHTML = '';
    MODES.forEach(m => {
      const card = document.createElement('div');
      card.className = `mode-card${m.id === this.modeId ? ' selected' : ''}`;
      const nameKey = `mode_${m.id}`;
      const descKey = `mode_${m.id}Desc`;
      const fallbackName = I18n.translations.en[`mode_${m.id}`] || I18n.t(m.nameKey);
      const fallbackDesc = I18n.translations.en[`mode_${m.id}Desc`] || I18n.t(m.descKey);
      card.innerHTML = `
        <div class="mode-icon">${m.icon}</div>
        <div class="mode-name">${I18n.t(nameKey) || fallbackName}</div>
        <div class="mode-desc">${I18n.t(descKey) || fallbackDesc}</div>
      `;
      card.onclick = () => { this.modeId = m.id; this.renderSetup(); };
      grid.appendChild(card);
    });
    this.updateModeSettings();
    this.updateNameInputs();
    this.updateDynamicTexts();
  },

  updateModeSettings() {
    const m = MODES.find(x => x.id === this.modeId);
    const titleKey = `mode_${m.id}`;
    $('modeSettingsTitle').textContent = `「${I18n.t(titleKey)}」${I18n.t('modeSettings')}`;
    const body = $('modeSettingsBody');
    body.innerHTML = '';
    m.settings.forEach(s => {
      const row = document.createElement('div');
      row.className = 'setting-row';
      const labelKey = `mode_${s.labelKey}` || s.labelKey;
      const label = I18n.t(labelKey) || s.labelKey;
      const unitKey = `mode_${s.unitKey}` || s.unitKey;
      const unit = I18n.t(unitKey) || s.unitKey;
      let inp;
      if (s.options) {
        inp = `<select class="num-input" id="ms_${s.key}">`;
        s.options.forEach(o => { inp += `<option value="${o}"${o === s.def ? ' selected' : ''}>${o}</option>`; });
        inp += '</select>';
      } else {
        inp = `<input type="number" class="num-input" id="ms_${s.key}" value="${s.def}" min="${s.min || 0}" max="${s.max || ''}">`;
      }
      row.innerHTML = `<span class="setting-label">${label}</span>${inp}<span class="time-unit">${unit}</span>`;
      body.appendChild(row);
    });
  },

  onPlayerCountChange() {
    this.playerCount = Math.max(1, parseInt($('playerCountInput').value) || 1);
    this.updateNameInputs();
  },

  updateNameInputs() {
    const list = $('playerNamesList');
    list.innerHTML = '';
    for (let i = 1; i <= this.playerCount; i++) {
      const inp = document.createElement('input');
      inp.className = 'name-input';
      inp.placeholder = `${I18n.t('player')} ${i}`;
      inp.maxLength = 10;
      list.appendChild(inp);
    }
  },

  startGame() {
    GameInstance.modeId = this.modeId;
    GameInstance.playerCount = this.playerCount;
    GameInstance.start();
  },

  updateDynamicTexts() {
    $('startBtn').textContent = I18n.t('startGame');
    $('exitBtn').textContent = I18n.t('endGame');
    $('resumeBtn').textContent = I18n.t('resume');
    $('restartBtn').textContent = I18n.t('playAgain');
    const pauseParts = I18n.t('pause').split(' ');
    if (pauseParts.length >= 2) {
      $('pauseBtn').textContent = `${pauseParts[0]} ${pauseParts[1]}`;
    }
  }
};
