name: Migrate mode section continuity

on:
  push:
    branches:
      - fix/table-os-mode-section-continuity
    paths:
      - .github/scripts/migrate-mode-section-continuity.py
      - .github/workflows/migrate-mode-section-continuity.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/table-os-mode-section-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply migration
        run: python .github/scripts/migrate-mode-section-continuity.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full check
        run: npm run check
      - name: Commit product tree and remove temporary files
        run: |
          rm .github/scripts/migrate-mode-section-continuity.py
          rm .github/workflows/migrate-mode-section-continuity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve Table OS section across mode changes"
          git push origin HEAD:fix/table-os-mode-section-continuity
