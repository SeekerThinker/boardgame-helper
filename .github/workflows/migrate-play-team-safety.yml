name: Migrate play team safety

on:
  push:
    branches:
      - fix/play-team-replacement-safety

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/play-team-replacement-safety
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply migration
        run: python .github/scripts/migrate-play-team-safety.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full check
        run: npm run check
      - name: Commit product tree and remove temporary files
        run: |
          rm .github/scripts/migrate-play-team-safety.py
          rm .github/workflows/migrate-play-team-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep team replacement in edit mode"
          git push origin HEAD:fix/play-team-replacement-safety
