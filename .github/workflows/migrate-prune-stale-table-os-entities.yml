name: Migrate stale Table OS entities

on:
  push:
    branches:
      - fix/prune-stale-table-os-entities

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply focused migration
        run: python .github/tmp/prune-stale-table-os-entities.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate full repository
        run: npm run check
      - name: Commit validated product tree and remove migration scaffolding
        run: |
          rm -f .github/tmp/prune-stale-table-os-entities.py
          rm -f .github/workflows/migrate-prune-stale-table-os-entities.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: prune stale Table OS entity values"
          git push
