name: Deploy Web Preview

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_ready: ${{ steps.pages-status.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static PWA
        run: npm run build
      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/privacy.html
          test -f dist/src/app.js
          test -f dist/src/tabletop.js
          test -f dist/src/tabletop-core.js
          test -f dist/src/tabletop.css
          test -f dist/src/tabletop-event-boundary.js
          grep -q 'manifest.json' dist/index.html
          grep -q 'src/tabletop.js' dist/index.html
          grep -q 'src/tabletop-event-boundary.js' dist/index.html
          grep -q 'serviceWorker' dist/src/app.js
          grep -q 'TABLE_OS_STORAGE_KEY' dist/src/tabletop-core.js
          grep -q 'LEGACY_CLOSE_SELECTOR' dist/src/tabletop-event-boundary.js
          touch dist/.nojekyll
      - name: Upload downloadable web preview
        uses: actions/upload-artifact@v7
        with:
          name: boardgame-helper-web-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Record Pages availability
        id: pages-status
        shell: bash
        run: echo "ready=${{ steps.pages.outcome == 'success' }}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke-test deployed Pages site
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}/"

          fetch() {
            local path="$1"
            local output="$2"
            local label="/${path}"
            if [ -z "$path" ]; then
              label='/'
            fi
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 6 \
              --retry-all-errors \
              --retry-delay 5 \
              "${BASE_URL}${path}" \
              --output "$output"
            printf 'OK %s\n' "$label"
          }

          fetch '' "$RUNNER_TEMP/index.html"
          fetch 'manifest.json' "$RUNNER_TEMP/manifest.json"
          fetch 'sw.js' "$RUNNER_TEMP/sw.js"
          fetch 'privacy.html' "$RUNNER_TEMP/privacy.html"
          fetch 'src/app.js' "$RUNNER_TEMP/app.js"
          fetch 'src/tabletop.js' "$RUNNER_TEMP/tabletop.js"
          fetch 'src/tabletop-core.js' "$RUNNER_TEMP/tabletop-core.js"
          fetch 'src/tabletop.css' "$RUNNER_TEMP/tabletop.css"
          fetch 'src/tabletop-event-boundary.js' "$RUNNER_TEMP/tabletop-event-boundary.js"

          grep -q 'manifest.json' "$RUNNER_TEMP/index.html"
          grep -q 'src/app.js' "$RUNNER_TEMP/index.html"
          grep -q 'src/tabletop.js' "$RUNNER_TEMP/index.html"
          grep -q 'src/tabletop-event-boundary.js' "$RUNNER_TEMP/index.html"
          grep -q 'serviceWorker' "$RUNNER_TEMP/app.js"
          grep -q 'TABLE_OS_STORAGE_KEY' "$RUNNER_TEMP/tabletop-core.js"
          grep -q 'LEGACY_CLOSE_SELECTOR' "$RUNNER_TEMP/tabletop-event-boundary.js"
          grep -q 'tableos-' "$RUNNER_TEMP/tabletop.css"
          grep -q '"name": "桌游助手"' "$RUNNER_TEMP/manifest.json"
          grep -q '"start_url": "./"' "$RUNNER_TEMP/manifest.json"
          grep -q '"scope": "./"' "$RUNNER_TEMP/manifest.json"

          printf 'Live preview verified: %s\n' "$BASE_URL" | tee -a "$GITHUB_STEP_SUMMARY"
