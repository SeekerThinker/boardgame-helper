name: Deploy Web Preview

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_ready: ${{ steps.pages-status.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static PWA
        run: npm run build
      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/privacy.html
          test -f dist/src/app.js
          grep -q 'manifest.json' dist/index.html
          grep -q 'serviceWorker' dist/src/app.js
          touch dist/.nojekyll
      - name: Upload downloadable web preview
        uses: actions/upload-artifact@v7
        with:
          name: boardgame-helper-web-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Record Pages availability
        id: pages-status
        shell: bash
        run: echo "ready=${{ steps.pages.outcome == 'success' }}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
