name: Migrate score variable key safety

on:
  push:
    branches:
      - fix/score-variable-rename-safety

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply focused migration
        run: python .github/scripts/migrate-score-key-safety.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate full repository
        run: npm run check
      - name: Commit validated product tree and remove migration scaffolding
        run: |
          rm .github/workflows/migrate-score-key-safety.yml .github/scripts/migrate-score-key-safety.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep score formulas stable when variables change"
          git push origin HEAD:${GITHUB_REF_NAME}
