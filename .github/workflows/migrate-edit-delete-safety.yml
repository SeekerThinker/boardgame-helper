name: Migrate edit delete safety

on:
  push:
    branches:
      - fix/edit-destructive-delete-safety

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/edit-destructive-delete-safety
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply focused migration
        run: python .github/scripts/migrate-edit-delete-safety.py
      - name: Validate migrated workspace
        run: |
          git diff --check
          npm run check
      - name: Commit product diff and remove migration scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tabletop.js tests/e2e/run-table-os-e2e.js docs/TABLE_OS_TEST_MATRIX.md
          git rm .github/scripts/migrate-edit-delete-safety.py .github/workflows/migrate-edit-delete-safety.yml
          git commit -m 'fix: confirm destructive edit deletions'
          git push origin HEAD:fix/edit-destructive-delete-safety
