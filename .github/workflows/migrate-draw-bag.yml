name: Migrate draw bag

on:
  push:
    branches:
      - feat/draw-bag-without-replacement
    paths:
      - .github/workflows/migrate-draw-bag.yml
      - .github/scripts/migrate-draw-bag.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/draw-bag-without-replacement
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/migrate-draw-bag.py')
          text = p.read_text()
          text = text.replace("'tools.history': 'Recent results'", "'tools.history': 'Recent Results'")
          p.write_text(text)
          PY
          python .github/scripts/migrate-draw-bag.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/unit/core.test.js')
          text = p.read_text()
          old = "test('default state uses schema v2 and subtracting preset fields', () => {\n  const state = createDefaultState();\n  assert.equal(state.schemaVersion, 2);"
          new = "test('default state uses schema v3 and subtracting preset fields', () => {\n  const state = createDefaultState();\n  assert.equal(state.schemaVersion, 3);"
          if text.count(old) != 1:
              raise SystemExit(f'core.test.js schema anchor count: {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full check
        run: npm run check
      - name: Commit product tree and remove temporary files
        run: |
          rm .github/scripts/migrate-draw-bag.py .github/workflows/migrate-draw-bag.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add draw bag without replacement"
          git push origin HEAD:feat/draw-bag-without-replacement
