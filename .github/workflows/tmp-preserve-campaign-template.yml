name: Temporary campaign template safety migration

on:
  push:
    branches:
      - fix/preserve-campaign-on-template-apply
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-campaign-on-template-apply
          fetch-depth: 0
      - name: Apply focused source and test changes
        shell: bash
        run: |
          python .github/tmp/preserve-campaign-template.py
          git diff --check
          git diff -- src/tabletop-core.js tests/e2e/run-table-os-e2e.js docs/TABLE_OS_TEST_MATRIX.md
      - name: Commit focused fix and remove migration files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tabletop-core.js tests/e2e/run-table-os-e2e.js docs/TABLE_OS_TEST_MATRIX.md
          git commit -m "fix: preserve campaign memory across templates"
          git push origin HEAD:fix/preserve-campaign-on-template-apply
          git rm .github/workflows/tmp-preserve-campaign-template.yml .github/tmp/preserve-campaign-template.py
          git commit -m "chore: remove temporary migration files"
          git push origin HEAD:fix/preserve-campaign-on-template-apply
