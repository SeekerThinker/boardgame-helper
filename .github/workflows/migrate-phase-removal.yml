name: Migrate phase removal continuity

on:
  push:
    branches:
      - fix/phase-removal-active-identity

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply focused migration
        run: python .github/scripts/migrate-phase-removal.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate full repository
        run: npm run check
      - name: Commit validated product tree and remove migration scaffolding
        shell: bash
        run: |
          rm -f .github/scripts/migrate-phase-removal.py .github/workflows/migrate-phase-removal.yml
          git add src/tabletop-core.js tests/unit/tabletop-phase-removal.test.js tests/e2e/run-table-os-e2e.js docs/TABLE_OS_TEST_MATRIX.md .github/scripts/migrate-phase-removal.py .github/workflows/migrate-phase-removal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve active phase when editing phase list'
          git push origin HEAD:fix/phase-removal-active-identity
