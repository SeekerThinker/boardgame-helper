name: Migrate entity template confirmation

on:
  push:
    branches:
      - fix/table-os-entity-template-confirmation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/table-os-entity-template-confirmation
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply focused patch
        run: python .github/tmp/fix-entity-template-confirmation.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full check
        run: npm run check
      - name: Commit product tree and remove temporary migration files
        run: |
          rm .github/tmp/fix-entity-template-confirmation.py
          rm .github/workflows/migrate-entity-template-confirmation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix: disclose table entity resets before template apply"
          git push
