name: Table OS Focus Migration

on:
  push:
    branches:
      - fix/table-os-focus-management-20260912

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/table-os-focus-management-20260912
      - name: Add modal focus management and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/tabletop.js')
          source = path.read_text()

          replacements = [
            (
              "let toastTimer = null;\n",
              "let toastTimer = null;\nlet roleRevealReturnId = null;\nconst FOCUSABLE_SELECTOR = 'button:not([disabled]), [href], input:not([disabled]):not([type=\\\"hidden\\\"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex=\\\"-1\\\"])';\n"
            ),
            (
              "    launcher.addEventListener('click', () => { isOpen = true; initializeParticipants(); render(); });",
              "    launcher.addEventListener('click', () => {\n      isOpen = true;\n      initializeParticipants();\n      render();\n      focusTableOsDialog();\n    });"
            ),
            (
              "function restoreRenderContext(context) {\n  const sheet = document.querySelector('.tableos-sheet');\n  if (sheet) sheet.scrollTop = context.scrollTop;\n  if (!context.focusSelector) return;\n  const next = document.querySelector(context.focusSelector);\n  if (next instanceof HTMLElement) next.focus({ preventScroll: true });\n}\n\nfunction render() {",
              "function restoreRenderContext(context) {\n  const sheet = document.querySelector('.tableos-sheet');\n  if (sheet) sheet.scrollTop = context.scrollTop;\n  if (!context.focusSelector) return;\n  const next = document.querySelector(context.focusSelector);\n  if (next instanceof HTMLElement) next.focus({ preventScroll: true });\n}\n\nfunction visibleFocusableElements(container) {\n  if (!(container instanceof HTMLElement)) return [];\n  return [...container.querySelectorAll(FOCUSABLE_SELECTOR)].filter(element =>\n    element instanceof HTMLElement && element.getClientRects().length > 0 && !element.hasAttribute('hidden')\n  );\n}\n\nfunction focusElement(element) {\n  if (element instanceof HTMLElement) element.focus({ preventScroll: true });\n}\n\nfunction focusTableOsDialog() {\n  const dialog = document.querySelector('.tableos-sheet[role=\\\"dialog\\\"]');\n  if (!(dialog instanceof HTMLElement)) return;\n  const focusable = visibleFocusableElements(dialog);\n  focusElement(dialog.querySelector('[data-os-action=\\\"close\\\"]') || focusable[0] || dialog);\n}\n\nfunction focusRoleReveal() {\n  const dialog = document.querySelector('.tableos-secret[role=\\\"dialog\\\"]');\n  if (!(dialog instanceof HTMLElement)) return;\n  focusElement(visibleFocusableElements(dialog)[0] || dialog);\n}\n\nfunction focusRoleTrigger(participantId) {\n  if (!participantId) return;\n  focusElement(document.querySelector(`[data-os-role-reveal=\\\"${CSS.escape(participantId)}\\\"]`));\n}\n\nfunction closeRoleReveal() {\n  const participantId = roleRevealReturnId || revealedParticipantId;\n  revealedParticipantId = null;\n  revealArmed = false;\n  roleRevealReturnId = null;\n  render();\n  focusRoleTrigger(participantId);\n}\n\nfunction closeTableOs() {\n  isOpen = false;\n  revealedParticipantId = null;\n  revealArmed = false;\n  roleRevealReturnId = null;\n  render();\n  focusElement(document.getElementById('tableos-launcher'));\n}\n\nfunction trapModalFocus(event) {\n  if (event.key !== 'Tab' || !isOpen) return false;\n  const dialog = revealedParticipantId\n    ? document.querySelector('.tableos-secret[role=\\\"dialog\\\"]')\n    : document.querySelector('.tableos-sheet[role=\\\"dialog\\\"]');\n  if (!(dialog instanceof HTMLElement)) return false;\n  const focusable = visibleFocusableElements(dialog);\n  if (!focusable.length) {\n    event.preventDefault();\n    focusElement(dialog);\n    return true;\n  }\n  const first = focusable[0];\n  const last = focusable[focusable.length - 1];\n  const active = document.activeElement;\n  if (!dialog.contains(active)) {\n    event.preventDefault();\n    focusElement(event.shiftKey ? last : first);\n    return true;\n  }\n  if (event.shiftKey && active === first) {\n    event.preventDefault();\n    focusElement(last);\n    return true;\n  }\n  if (!event.shiftKey && active === last) {\n    event.preventDefault();\n    focusElement(first);\n    return true;\n  }\n  return false;\n}\n\nfunction render() {"
            ),
            (
              "      <section class=\"tableos-sheet ${state.ui.mode === 'edit' ? 'is-editing' : 'is-playing'}\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"tableos-title\">",
              "      <section class=\"tableos-sheet ${state.ui.mode === 'edit' ? 'is-editing' : 'is-playing'}\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"tableos-title\" tabindex=\"-1\">"
            ),
            (
              "if (!revealArmed) return `<div class=\"tableos-secret\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${attr(tr('revealFor'))}\">",
              "if (!revealArmed) return `<div class=\"tableos-secret\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${attr(tr('revealFor'))}\" tabindex=\"-1\">"
            ),
            (
              "return `<div class=\"tableos-secret\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${attr(tr('revealFor'))}\">",
              "return `<div class=\"tableos-secret\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${attr(tr('revealFor'))}\" tabindex=\"-1\">"
            ),
            (
              "    if (d.osAction === 'close') { if (event.target.closest('.tableos-sheet') && !event.target.closest('[data-os-action=\"close\"]')) return; isOpen = false; revealedParticipantId = null; revealArmed = false; render(); return; }",
              "    if (d.osAction === 'close') { if (event.target.closest('.tableos-sheet') && !event.target.closest('[data-os-action=\"close\"]')) return; closeTableOs(); return; }"
            ),
            (
              "    if (d.osAction === 'hide-role') { revealedParticipantId = null; revealArmed = false; render(); return; }",
              "    if (d.osAction === 'hide-role') { closeRoleReveal(); return; }"
            ),
            (
              "    if (d.osAction === 'reveal-role-now') { revealArmed = true; render(); return; }",
              "    if (d.osAction === 'reveal-role-now') { revealArmed = true; render(); focusRoleReveal(); return; }"
            ),
            (
              "    if (d.osRoleReveal) { revealedParticipantId = d.osRoleReveal; revealArmed = false; render(); return; }",
              "    if (d.osRoleReveal) { roleRevealReturnId = d.osRoleReveal; revealedParticipantId = d.osRoleReveal; revealArmed = false; render(); focusRoleReveal(); return; }"
            ),
            (
              "  document.addEventListener('keydown', event => {\n    if (event.key === 'Escape' && revealedParticipantId) { revealedParticipantId = null; revealArmed = false; render(); return; }\n    if (event.key === 'Escape' && isOpen) { isOpen = false; render(); }\n  });",
              "  document.addEventListener('keydown', event => {\n    if (event.key === 'Tab' && isOpen) { trapModalFocus(event); return; }\n    if (event.key === 'Escape' && revealedParticipantId) { event.preventDefault(); closeRoleReveal(); return; }\n    if (event.key === 'Escape' && isOpen) { event.preventDefault(); closeTableOs(); }\n  });"
            )
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'missing tabletop.js replacement anchor: {old[:100]!r}')
              source = source.replace(old, new, 1)
          path.write_text(source)

          test_path = Path('tests/e2e/run-table-os-e2e.js')
          test = test_path.read_text()
          old = """async function assertNoHorizontalOverflow(page, label) {\n  const metrics = await page.evaluate(() => ({ width: innerWidth, scrollWidth: document.documentElement.scrollWidth }));\n  assert.ok(metrics.scrollWidth <= metrics.width + 1, `${label} should not horizontally overflow: ${JSON.stringify(metrics)}`);\n}\n"""
          new = old + """\nasync function assertFocusTrapped(page, dialogSelector, label) {\n  const focusableSelector = 'button:not([disabled]), [href], input:not([disabled]):not([type=\\\"hidden\\\"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex=\\\"-1\\\"])';\n  const count = await page.evaluate(({ dialogSelector, focusableSelector }) => {\n    const dialog = document.querySelector(dialogSelector);\n    if (!(dialog instanceof HTMLElement)) return 0;\n    const items = [...dialog.querySelectorAll(focusableSelector)].filter(element => element instanceof HTMLElement && element.getClientRects().length > 0);\n    items.at(-1)?.focus();\n    return items.length;\n  }, { dialogSelector, focusableSelector });\n  assert.ok(count > 1, `${label} should have multiple focusable controls`);\n  await page.keyboard.press('Tab');\n  assert.equal(await page.evaluate(({ dialogSelector, focusableSelector }) => {\n    const dialog = document.querySelector(dialogSelector);\n    const items = dialog ? [...dialog.querySelectorAll(focusableSelector)].filter(element => element instanceof HTMLElement && element.getClientRects().length > 0) : [];\n    return items.length > 0 && document.activeElement === items[0];\n  }, { dialogSelector, focusableSelector }), true, `${label} should wrap Tab from last to first`);\n  await page.keyboard.press('Shift+Tab');\n  assert.equal(await page.evaluate(({ dialogSelector, focusableSelector }) => {\n    const dialog = document.querySelector(dialogSelector);\n    const items = dialog ? [...dialog.querySelectorAll(focusableSelector)].filter(element => element instanceof HTMLElement && element.getClientRects().length > 0) : [];\n    return items.length > 0 && document.activeElement === items.at(-1);\n  }, { dialogSelector, focusableSelector }), true, `${label} should wrap Shift+Tab from first to last`);\n}\n"""
          if old not in test:
              raise SystemExit('missing focus helper anchor')
          test = test.replace(old, new, 1)

          old = """  await launcher.click();\n  assert.ok(await page.getByRole('dialog', { name: '高级桌游助手' }).isVisible());\n"""
          new = """  await launcher.click();\n  const tableDialog = page.getByRole('dialog', { name: '高级桌游助手' });\n  assert.ok(await tableDialog.isVisible());\n  assert.equal(await tableDialog.evaluate(dialog => dialog.contains(document.activeElement)), true, 'focus enters Table OS when opened');\n  await assertFocusTrapped(page, '.tableos-sheet[role=\"dialog\"]', 'Table OS dialog');\n"""
          if old not in test:
              raise SystemExit('missing launcher focus anchor')
          test = test.replace(old, new, 1)

          old = """  await page.locator('[data-os-role-reveal]').first().click();\n  assert.equal(await page.getByText('侦察员', { exact: true }).count(), 0, 'role stays hidden before player confirms identity');\n"""
          new = """  const firstRoleReveal = page.locator('[data-os-role-reveal]').first();\n  await firstRoleReveal.click();\n  const secretDialog = page.locator('.tableos-secret[role=\"dialog\"]');\n  assert.equal(await secretDialog.evaluate(dialog => dialog.contains(document.activeElement)), true, 'focus enters private role reveal');\n  await assertFocusTrapped(page, '.tableos-secret[role=\"dialog\"]', 'private role reveal');\n  assert.equal(await page.getByText('侦察员', { exact: true }).count(), 0, 'role stays hidden before player confirms identity');\n"""
          if old not in test:
              raise SystemExit('missing role reveal focus anchor')
          test = test.replace(old, new, 1)

          old = """  assert.equal(await page.getByText(/主持人机密/).count(), 0, 'moderator note never appears after reveal');\n  await page.getByRole('button', { name: '看完了' }).click();\n"""
          new = """  assert.equal(await page.getByText(/主持人机密/).count(), 0, 'moderator note never appears after reveal');\n  await page.keyboard.press('Escape');\n  assert.equal(await firstRoleReveal.evaluate(element => element === document.activeElement), true, 'closing private reveal returns focus to its trigger');\n"""
          if old not in test:
              raise SystemExit('missing nested focus return anchor')
          test = test.replace(old, new, 1)

          old = """  await page.getByRole('button', { name: '关闭' }).click();\n  await page.getByRole('button', { name: '界面语言' }).click();\n"""
          new = """  await page.keyboard.press('Escape');\n  assert.equal(await launcher.evaluate(element => element === document.activeElement), true, 'closing Table OS returns focus to the launcher');\n  await page.getByRole('button', { name: '界面语言' }).click();\n"""
          if old not in test:
              raise SystemExit('missing launcher focus return anchor')
          test = test.replace(old, new, 1)

          old = """      'toolbox-team bridge', 'two-stage private role reveal', 'moderator-note isolation', 'formula score sheet',\n      'unary formula operators',\n"""
          new = """      'toolbox-team bridge', 'two-stage private role reveal', 'moderator-note isolation', 'modal focus trap',\n      'nested reveal focus return', 'launcher focus return', 'formula score sheet', 'unary formula operators',\n"""
          if old not in test:
              raise SystemExit('missing summary focus anchor')
          test = test.replace(old, new, 1)
          test_path.write_text(test)
          PY
      - name: Commit generated source changes
        run: |
          rm .github/workflows/tableos-focus-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tabletop.js tests/e2e/run-table-os-e2e.js .github/workflows/tableos-focus-migrate.yml
          git commit -m 'fix: contain and restore Table OS focus'
          git push origin HEAD:fix/table-os-focus-management-20260912
