name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  store-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Generate store assets
        run: npm run assets:store
      - name: Validate store asset files and dimensions
        run: npm run check:store-assets
      - name: Upload store assets
        uses: actions/upload-artifact@v7
        with:
          name: boardgame-helper-store-assets
          path: |
            google-play-assets/feature-graphic-1024x500.jpg
            google-play-assets/screenshots/
            app-store-assets/screenshots/
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: Ensure Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: npm run sync:android
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Build Android release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: boardgame-helper-android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Smoke-test Android release signing injection
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_KEYSTORE="$RUNNER_TEMP/ci-release-signing-source.jks"
          DECODED_KEYSTORE="$RUNNER_TEMP/ci-release-signing-decoded.jks"
          KEYSTORE_B64="$RUNNER_TEMP/ci-release-signing.b64"
          STORE_PASSWORD='ci-store-password-2026'
          KEY_PASSWORD='ci-key-password-2026'
          KEY_ALIAS='ci-signing-smoke'

          keytool -genkeypair \
            -keystore "$SOURCE_KEYSTORE" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname 'CN=Board Game Assistant CI Signing Smoke, OU=CI, O=SeekerThinker, C=JP'

          base64 -w 0 "$SOURCE_KEYSTORE" > "$KEYSTORE_B64"
          rm -f "$SOURCE_KEYSTORE"
          base64 --decode "$KEYSTORE_B64" > "$DECODED_KEYSTORE"
          chmod 600 "$DECODED_KEYSTORE"

          (
            cd android
            BGA_STORE_FILE="$DECODED_KEYSTORE" \
            BGA_STORE_PASSWORD="$STORE_PASSWORD" \
            BGA_KEY_ALIAS="$KEY_ALIAS" \
            BGA_KEY_PASSWORD="$KEY_PASSWORD" \
            ./gradlew bundleRelease --no-daemon --rerun-tasks
          )

          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/jarsigner-smoke.txt"
          grep -qi 'jar verified\.' "$RUNNER_TEMP/jarsigner-smoke.txt"
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/certificate-smoke.txt"
          grep -q 'SHA256:' "$RUNNER_TEMP/certificate-smoke.txt"

          rm -f "$DECODED_KEYSTORE" "$KEYSTORE_B64"

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:ios
      - name: Inspect Xcode project
        run: xcodebuild -list -project ios/App/App.xcodeproj
      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -target App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

  release-candidate:
    needs: [audit, check, store-assets, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run build
      - name: Download generated store assets
        uses: actions/download-artifact@v7
        with:
          name: boardgame-helper-store-assets
          path: release-input/store
      - name: Download Android builds
        uses: actions/download-artifact@v7
        with:
          name: boardgame-helper-android-builds
          path: release-input/android
      - name: Assemble release candidate
        run: >-
          node scripts/prepare-release-candidate.js
          --android-aab=release-input/android/bundle/release/app-release.aab
          --store-assets-dir=release-input/store
      - name: Validate release candidate
        run: npm run check:release-candidate
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: boardgame-helper-release-candidate
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7
