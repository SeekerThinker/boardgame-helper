name: Table OS export privacy migration gate

on:
  push:
    branches:
      - fix/table-os-export-privacy

permissions:
  contents: write

jobs:
  migrate-and-check:
    if: "github.event.head_commit.message != 'fix: disclose full Table OS backup privacy'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply focused migration
        run: python scripts/migrate-table-os-export-privacy.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full check
        run: npm run check
      - name: Commit product changes and remove migration scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tabletop.js tests/e2e/run-table-os-e2e.js docs/TABLE_OS_TEST_MATRIX.md
          git rm scripts/migrate-table-os-export-privacy.py .github/workflows/migrate-table-os-export-privacy.yml
          git commit -m "fix: disclose full Table OS backup privacy"
          git push origin HEAD:fix/table-os-export-privacy
