name: Migrate play team replacement safety

on:
  push:
    branches:
      - fix/play-team-replacement-safety

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/play-team-replacement-safety
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python3 .github/scripts/migrate-play-team-replacement-safety.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Commit product changes and remove migration scaffolding
        run: |
          rm .github/scripts/migrate-play-team-replacement-safety.py
          rm .github/workflows/migrate-play-team-replacement-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: confirm destructive toolbox team replacement"
          git push origin HEAD:fix/play-team-replacement-safety
