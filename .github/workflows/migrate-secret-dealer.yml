name: Temporary secret dealer integration

on:
  push:
    branches: [feat/local-secret-deal-host]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: "github.event.head_commit.message != 'feat: launch local secret dealer and manual host prompts'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply exact, focused integration
        run: python3 .github/scripts/migrate-secret-dealer.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prevalidate complete project
        run: npm run check
      - name: Remove migration scaffolding and push validated code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js package.json .github/workflows/pages.yml src/secret-dealer.js tests/e2e/run-secret-dealer-e2e.js
          git rm .github/scripts/migrate-secret-dealer.py .github/workflows/migrate-secret-dealer.yml
          git commit -m 'feat: launch local secret dealer and manual host prompts'
          git push origin HEAD:feat/local-secret-deal-host
