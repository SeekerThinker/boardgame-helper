name: Migrate score standings

on:
  push:
    branches:
      - feat/score-standings-ranking
    paths:
      - .github/scripts/migrate-score-standings.py
      - .github/scripts/fix-score-standings-e2e.py
      - .github/workflows/migrate-score-standings.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/score-standings-ranking
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply migration
        run: |
          python .github/scripts/migrate-score-standings.py
          python .github/scripts/fix-score-standings-e2e.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full check
        run: npm run check
      - name: Commit product tree and remove temporary files
        run: |
          rm .github/scripts/migrate-score-standings.py .github/scripts/fix-score-standings-e2e.py .github/workflows/migrate-score-standings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add score standings and tie ranking"
          git push origin HEAD:feat/score-standings-ranking
