name: Table OS Final Score Bridge Migration

on:
  push:
    branches:
      - feat/table-os-final-score-bridge-20260912

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/table-os-final-score-bridge-20260912
          fetch-depth: 0
      - name: Apply final-score bridge
        run: python scripts/migrate-table-os-score-bridge.py
      - name: Commit generated bridge changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/core.js src/app.js src/tabletop-companion.js src/archive.js tests/unit/core.test.js tests/unit/archive.test.js tests/e2e/run-table-os-companion-e2e.js TABLE_OS.md
          git rm .github/workflows/table-os-score-bridge-migrate.yml scripts/migrate-table-os-score-bridge.py
          git commit -m "feat: bridge Table OS totals into final results"
          git push origin HEAD:feat/table-os-final-score-bridge-20260912
