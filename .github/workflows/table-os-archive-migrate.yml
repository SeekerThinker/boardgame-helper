name: Table OS Archive Migration

on:
  push:
    branches:
      - feat/table-os-archive-summary-20260912
    paths:
      - .github/workflows/table-os-archive-migrate.yml
      - .github/scripts/table-os-archive-migrate.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/table-os-archive-summary-20260912
          fetch-depth: 0

      - name: Generate archive bridge changes
        run: python3 .github/scripts/table-os-archive-migrate.py

      - name: Commit generated source changes
        shell: bash
        run: |
          rm .github/workflows/table-os-archive-migrate.yml .github/scripts/table-os-archive-migrate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tabletop-core.js src/tabletop-companion.js src/archive.js src/app.js src/i18n.js tests/unit/archive.test.js tests/e2e/run-table-os-companion-e2e.js .github/workflows/table-os-archive-migrate.yml .github/scripts/table-os-archive-migrate.py
          git diff --cached --check
          git commit -m "feat: archive privacy-safe Table OS summaries"
          git push origin HEAD:feat/table-os-archive-summary-20260912
