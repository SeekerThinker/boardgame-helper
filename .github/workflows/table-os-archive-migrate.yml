name: Table OS Archive Migration

on:
  push:
    branches:
      - feat/table-os-archive-summary-20260912
    paths:
      - .github/workflows/table-os-archive-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/table-os-archive-summary-20260912
          fetch-depth: 0

      - name: Add privacy-safe Table OS archive summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, before, after, label) {
            if (!source.includes(before)) throw new Error(`${label} anchor not found`);
            return source.replace(before, after);
          }

          // Share the companion session identity as a pure helper so archive capture
          // can verify that Table OS actually belongs to the game being finished.
          const corePath = 'src/tabletop-core.js';
          let core = fs.readFileSync(corePath, 'utf8');
          core = replaceOnce(core,
            "export const TABLE_OS_STORAGE_KEY = 'board-game-assistant-table-os-v1';\n",
            "export const TABLE_OS_STORAGE_KEY = 'board-game-assistant-table-os-v1';\nexport const TABLE_OS_COMPANION_STORAGE_KEY = 'board-game-assistant-table-os-companion-v1';\n\nexport function tableOsMainSessionIdentity(game) {\n  const rounds = Array.isArray(game?.score?.rounds) ? game.score.rounds : [];\n  const firstRound = rounds.find(round => Number(round?.round) === 1);\n  const createdAt = typeof firstRound?.createdAt === 'string' ? firstRound.createdAt.trim() : '';\n  if (createdAt) return `round:${createdAt}`;\n  const startedAt = typeof game?.session?.startedAt === 'string' ? game.session.startedAt.trim() : '';\n  return startedAt ? `start:${startedAt}` : '';\n}\n",
            'tabletop-core session helper');
          fs.writeFileSync(corePath, core);

          const companionPath = 'src/tabletop-companion.js';
          let companion = fs.readFileSync(companionPath, 'utf8');
          companion = replaceOnce(companion,
            "import { TABLE_OS_STORAGE_KEY } from './tabletop-core.js';\n\nconst COMPANION_STORAGE_KEY = 'board-game-assistant-table-os-companion-v1';\n",
            "import { TABLE_OS_STORAGE_KEY, TABLE_OS_COMPANION_STORAGE_KEY, tableOsMainSessionIdentity } from './tabletop-core.js';\n",
            'companion imports');
          companion = companion.replaceAll('COMPANION_STORAGE_KEY', 'TABLE_OS_COMPANION_STORAGE_KEY');
          const identityStart = companion.indexOf('function mainSessionIdentity(game) {');
          const identityEnd = companion.indexOf('\nfunction tableHasSessionState', identityStart);
          if (identityStart < 0 || identityEnd < 0) throw new Error('companion identity helper boundary not found');
          companion = companion.slice(0, identityStart) + companion.slice(identityEnd + 1);
          companion = companion.replace('const currentId = mainSessionIdentity(game);', 'const currentId = tableOsMainSessionIdentity(game);');
          fs.writeFileSync(companionPath, companion);

          // Archive stores only a bounded, privacy-safe summary. Roles, factions,
          // moderator notes, campaign notes and checkpoint labels are never copied.
          const archivePath = 'src/archive.js';
          let archive = fs.readFileSync(archivePath, 'utf8');
          archive = replaceOnce(archive,
            "import { STORAGE_KEY, uid } from './core.js';\n",
            "import { STORAGE_KEY, uid } from './core.js';\nimport {\n  TABLE_OS_STORAGE_KEY, TABLE_OS_COMPANION_STORAGE_KEY, normalizeTableOsState,\n  scoreCardForParticipant, tableOsMainSessionIdentity\n} from './tabletop-core.js';\n",
            'archive imports');

          archive = replaceOnce(archive,
            "function safeColor(value) {\n  return /^#[0-9a-f]{6}$/i.test(value || '') ? value : '#64748b';\n}\n",
            `function safeColor(value) {
  return /^#[0-9a-f]{6}$/i.test(value || '') ? value : '#64748b';
}

function safeNumber(value, min = -1000000, max = 1000000) {
  const number = Number(value);
  if (!Number.isFinite(number)) return 0;
  return Math.round(Math.min(max, Math.max(min, number)) * 100) / 100;
}

function safeText(value, max = 60) {
  return String(value ?? '').trim().slice(0, max);
}

function normalizeTableOsArchiveSummary(input) {
  if (!input || typeof input !== 'object') return null;
  const scores = (Array.isArray(input.scores) ? input.scores : []).slice(0, 32).map(item => ({
    name: safeText(item?.name, 40), color: safeColor(item?.color), total: safeNumber(item?.total)
  }));
  const trackers = (Array.isArray(input.trackers) ? input.trackers : []).slice(0, 8).map(tracker => ({
    name: safeText(tracker?.name, 40),
    persistence: tracker?.persistence === 'campaign' ? 'campaign' : 'session',
    values: (Array.isArray(tracker?.values) ? tracker.values : []).slice(0, 8).map(value => ({
      label: safeText(value?.label, 40), value: safeNumber(value?.value)
    }))
  })).filter(tracker => tracker.name && tracker.values.length);
  const phase = input.phase && typeof input.phase === 'object' && safeText(input.phase.name, 60)
    ? { name: safeText(input.phase.name, 60), cycle: clampInt(input.phase.cycle, 1, 9999, 1) }
    : null;
  const campaign = input.campaign && typeof input.campaign === 'object'
    ? {
        name: safeText(input.campaign.name, 60), chapter: safeText(input.campaign.chapter, 60),
        sessionNumber: clampInt(input.campaign.sessionNumber, 1, 9999, 1),
        completedFlags: clampInt(input.campaign.completedFlags, 0, 40, 0),
        totalFlags: clampInt(input.campaign.totalFlags, 0, 40, 0)
      }
    : null;
  if (!scores.length && !trackers.length && !phase && !campaign) return null;
  return { templateId: safeText(input.templateId, 32), scores, trackers, phase, campaign };
}

function readJson(storage, key) {
  try {
    const raw = safeStorage(storage).getItem(key);
    const parsed = raw ? JSON.parse(raw) : null;
    return parsed && typeof parsed === 'object' ? parsed : null;
  } catch (_) {
    return null;
  }
}

function buildTableOsArchiveSummary(storage, liveGame) {
  const liveSessionId = tableOsMainSessionIdentity(liveGame);
  if (!liveSessionId) return null;
  const companion = readJson(storage, TABLE_OS_COMPANION_STORAGE_KEY);
  if (String(companion?.associatedMainSessionId || '') !== liveSessionId) return null;
  const rawTable = readJson(storage, TABLE_OS_STORAGE_KEY);
  if (!rawTable) return null;
  const table = normalizeTableOsState(rawTable);
  const participantById = new Map(table.participants.map(item => [item.id, item]));
  const teamById = new Map(table.teams.map(item => [item.id, item]));
  const trackers = table.trackers.map(tracker => {
    const values = Object.entries(tracker.values || {}).slice(0, 8).map(([id, value]) => ({
      label: tracker.scope === 'participant'
        ? (participantById.get(id)?.name || '')
        : (tracker.scope === 'team' ? (teamById.get(id)?.name || '') : ''),
      value
    }));
    return values.length ? { name: tracker.name, persistence: tracker.persistence, values } : null;
  }).filter(Boolean).slice(0, 8);
  const hasScoreValues = Object.values(table.scoreSheet.values || {}).some(values => values && Object.keys(values).length);
  const scores = hasScoreValues ? table.participants.slice(0, 32).map(participant => ({
    name: participant.name, color: participant.color,
    total: scoreCardForParticipant(table, participant.id).total
  })) : [];
  const activePhase = table.phases.items[table.phases.activeIndex];
  const phaseMoved = Boolean(activePhase) && (table.phases.activeIndex !== 0 || table.phases.cycle !== 1);
  const phase = phaseMoved ? { name: activePhase.name, cycle: table.phases.cycle } : null;
  const campaign = table.campaign.enabled ? {
    name: table.campaign.name, chapter: table.campaign.chapter, sessionNumber: table.campaign.sessionNumber,
    completedFlags: table.campaign.flags.filter(flag => flag.checked).length,
    totalFlags: table.campaign.flags.length
  } : null;
  return normalizeTableOsArchiveSummary({
    templateId: table.appliedTemplateId, scores, trackers, phase, campaign
  });
}
`,
            'archive summary helpers');

          archive = replaceOnce(archive,
            "    timerMode: ['turn', 'chess', 'pool', 'round'].includes(source.timerMode) ? source.timerMode : null,\n    baseSeconds: clampInt(source.baseSeconds, 5, 86400, 90)\n",
            "    timerMode: ['turn', 'chess', 'pool', 'round'].includes(source.timerMode) ? source.timerMode : null,\n    baseSeconds: clampInt(source.baseSeconds, 5, 86400, 90),\n    tableOs: normalizeTableOsArchiveSummary(source.tableOs)\n",
            'archive normalized table summary');

          const enrichStart = archive.indexOf('function enrichMissingConfig(entry, storage) {');
          const enrichEnd = archive.indexOf('\nexport function loadArchive', enrichStart);
          if (enrichStart < 0 || enrichEnd < 0) throw new Error('archive enrich boundary not found');
          const enrich = `function enrichMissingConfig(entry, storage) {
  const source = entry && typeof entry === 'object' ? entry : {};
  const needsFields = !Array.isArray(source.fields) || source.fields.length === 0;
  const needsTimerMode = !['turn', 'chess', 'pool', 'round'].includes(source.timerMode);
  const baseSeconds = Number(source.baseSeconds);
  const needsBaseSeconds = !Number.isFinite(baseSeconds) || baseSeconds < 5;
  const needsTableOs = source.tableOs == null;
  if (!needsFields && !needsTimerMode && !needsBaseSeconds && !needsTableOs) return source;

  const live = readJson(storage, STORAGE_KEY);
  if (!live) return source;
  return {
    ...source,
    fields: needsFields && Array.isArray(live.score?.fields) ? live.score.fields : source.fields,
    timerMode: needsTimerMode ? live.timer?.mode : source.timerMode,
    baseSeconds: needsBaseSeconds ? live.timer?.baseSeconds : source.baseSeconds,
    tableOs: needsTableOs ? buildTableOsArchiveSummary(storage, live) : source.tableOs
  };
}
`;
          archive = archive.slice(0, enrichStart) + enrich + archive.slice(enrichEnd);
          fs.writeFileSync(archivePath, archive);

          // Base archive UI renders the summary only inside the expanded historical game.
          const appPath = 'src/app.js';
          let app = fs.readFileSync(appPath, 'utf8');
          const renderArchiveAnchor = 'function renderArchive() {';
          const renderHelper = `function renderArchivedTableOs(game) {
  const table = game?.tableOs;
  if (!table) return '';
  const meta = [];
  if (table.phase) meta.push(tr('archive.tableOsPhase', { phase: table.phase.name, cycle: table.phase.cycle }));
  if (table.campaign) meta.push(tr('archive.tableOsCampaign', {
    name: table.campaign.name || tr('archive.tableOsCampaignFallback'),
    chapter: table.campaign.chapter || '—', session: table.campaign.sessionNumber
  }));
  if (table.campaign?.totalFlags) meta.push(tr('archive.tableOsFlags', {
    done: table.campaign.completedFlags, total: table.campaign.totalFlags
  }));
  const scores = table.scores?.length
    ? \`<p class="inline-note"><strong>\${tr('archive.tableOsScores')}</strong></p><ol class="archive-ranking">\${table.scores.map(player => \`<li style="--player:\${player.color}"><span>\${escapeHtml(player.name || tr('common.removedPlayer'))}</span><strong>\${player.total}</strong></li>\`).join('')}</ol>\`
    : '';
  const trackers = table.trackers?.length
    ? \`<p class="inline-note"><strong>\${tr('archive.tableOsTrackers')}</strong></p><div class="history-list">\${table.trackers.map(tracker => \`<div><span>\${escapeHtml(tracker.name)}</span><strong>\${tracker.values.map(value => escapeHtml(value.label ? \`\${value.label}: \${value.value}\` : String(value.value))).join(' · ')}</strong></div>\`).join('')}</div>\`
    : '';
  return \`<div data-archive-table-os><p class="inline-note"><strong>\${tr('archive.tableOs')}</strong>\${meta.length ? \` · \${escapeHtml(meta.join(' · '))}\` : ''}</p>\${scores}\${trackers}</div>\`;
}

`;
          app = replaceOnce(app, renderArchiveAnchor, renderHelper + renderArchiveAnchor, 'app archive helper');
          app = replaceOnce(app,
            "            <ol class=\"archive-ranking\">${game.players.map(player => `<li style=\"--player:${player.color}\"><span>${escapeHtml(player.name || tr('common.removedPlayer'))}</span><strong>${player.score}</strong></li>`).join('')}</ol>\n            <div class=\"archive-actions\">",
            "            <ol class=\"archive-ranking\">${game.players.map(player => `<li style=\"--player:${player.color}\"><span>${escapeHtml(player.name || tr('common.removedPlayer'))}</span><strong>${player.score}</strong></li>`).join('')}</ol>\n            ${renderArchivedTableOs(game)}\n            <div class=\"archive-actions\">",
            'app archive markup');

          const copyStart = app.indexOf('async function copyArchivedGame(id) {');
          const copyEnd = app.indexOf('\nfunction resumeSessionFlow()', copyStart);
          if (copyStart < 0 || copyEnd < 0) throw new Error('copy archive boundary not found');
          const copyFn = `async function copyArchivedGame(id) {
  const game = archivedGames.find(item => item.id === id);
  if (!game) return;
  const lines = [
    \`\${game.name} · \${formatDateTime(game.locale, game.finishedAt)}\`,
    ...game.players.map(player => \`\${player.rank}. \${player.name}: \${player.score}\`)
  ];
  if (game.tableOs) {
    lines.push('', tr('archive.tableOs'));
    if (game.tableOs.phase) lines.push(tr('archive.tableOsPhase', { phase: game.tableOs.phase.name, cycle: game.tableOs.phase.cycle }));
    if (game.tableOs.campaign) lines.push(tr('archive.tableOsCampaign', {
      name: game.tableOs.campaign.name || tr('archive.tableOsCampaignFallback'),
      chapter: game.tableOs.campaign.chapter || '—', session: game.tableOs.campaign.sessionNumber
    }));
    if (game.tableOs.scores?.length) {
      lines.push(tr('archive.tableOsScores'));
      game.tableOs.scores.forEach(player => lines.push(\`\${player.name}: \${player.total}\`));
    }
    if (game.tableOs.trackers?.length) {
      lines.push(tr('archive.tableOsTrackers'));
      game.tableOs.trackers.forEach(tracker => lines.push(\`\${tracker.name}: \${tracker.values.map(value => value.label ? \`\${value.label}: \${value.value}\` : value.value).join(' · ')}\`));
    }
  }
  const copied = await copyText(lines.join('\\n'));
  showToast(copied ? 'action.copied' : 'toast.copyFailed');
  render();
}
`;
          app = app.slice(0, copyStart) + copyFn + app.slice(copyEnd);
          fs.writeFileSync(appPath, app);

          const i18nPath = 'src/i18n.js';
          let i18n = fs.readFileSync(i18nPath, 'utf8');
          i18n = replaceOnce(i18n,
            "    'archive.rematch': '用此配置再来一局',\n    'archive.rematchConfirm': '按「{name}」的配置与名单开始新一局？当前进行中的对局会被替换，继续吗？',\n",
            "    'archive.rematch': '用此配置再来一局',\n    'archive.rematchConfirm': '按「{name}」的配置与名单开始新一局？当前进行中的对局会被替换，继续吗？',\n    'archive.tableOs': '高级桌面摘要', 'archive.tableOsScores': '高级总分', 'archive.tableOsTrackers': '状态快照',\n    'archive.tableOsPhase': '阶段 {phase} · 循环 {cycle}',\n    'archive.tableOsCampaign': '战役 {name} · {chapter} · 第 {session} 局',\n    'archive.tableOsCampaignFallback': '未命名战役', 'archive.tableOsFlags': '检查点 {done}/{total}',\n",
            'zh archive i18n');
          i18n = replaceOnce(i18n,
            "    'archive.rematch': 'Rematch with this setup',\n    'archive.rematchConfirm': 'Start a new game using \"{name}\"\\'s setup and roster? Any game in progress will be replaced. Continue?',\n",
            "    'archive.rematch': 'Rematch with this setup',\n    'archive.rematchConfirm': 'Start a new game using \"{name}\"\\'s setup and roster? Any game in progress will be replaced. Continue?',\n    'archive.tableOs': 'Advanced table summary', 'archive.tableOsScores': 'Advanced score', 'archive.tableOsTrackers': 'State snapshot',\n    'archive.tableOsPhase': 'Phase {phase} · Cycle {cycle}',\n    'archive.tableOsCampaign': 'Campaign {name} · {chapter} · Session {session}',\n    'archive.tableOsCampaignFallback': 'Unnamed campaign', 'archive.tableOsFlags': 'Checkpoints {done}/{total}',\n",
            'en archive i18n');
          fs.writeFileSync(i18nPath, i18n);

          const archiveTestPath = 'tests/unit/archive.test.js';
          let archiveTest = fs.readFileSync(archiveTestPath, 'utf8');
          archiveTest = replaceOnce(archiveTest,
            "import { STORAGE_KEY } from '../../src/core.js';\n",
            "import { STORAGE_KEY } from '../../src/core.js';\nimport { TABLE_OS_STORAGE_KEY, TABLE_OS_COMPANION_STORAGE_KEY } from '../../src/tabletop-core.js';\n",
            'archive test imports');
          const testAnchor = "test('explicit archive configuration wins over persisted fallback state', () => {";
          const privacyTest = `test('archive captures only the associated privacy-safe Table OS summary', () => {
  const createdAt = '2026-09-12T10:00:00.000Z';
  const storage = fakeStorage({
    [STORAGE_KEY]: JSON.stringify({
      session: { startedAt: createdAt },
      players: [{ id: 'p_1', name: 'Alice', color: '#f97316' }],
      timer: { mode: 'turn', baseSeconds: 90 },
      score: { rounds: [{ round: 1, createdAt }], fields: sampleGame.fields }
    }),
    [TABLE_OS_COMPANION_STORAGE_KEY]: JSON.stringify({ associatedMainSessionId: \`round:\${createdAt}\` }),
    [TABLE_OS_STORAGE_KEY]: JSON.stringify({
      appliedTemplateId: 'campaign',
      participants: [{ id: 'tp_1', sourcePlayerId: 'p_1', name: 'Alice', color: '#f97316' }],
      trackers: [{ id: 'tr_health', name: 'Health', scope: 'participant', initial: 10, min: 0, max: 20, step: 1, persistence: 'session', values: { tp_1: 7 } }],
      phases: { items: [{ id: 'ph_day', name: 'Day' }, { id: 'ph_night', name: 'Night', note: 'PRIVATE_PHASE_NOTE' }], activeIndex: 1, cycle: 2 },
      teams: [],
      roles: [{ participantId: 'tp_1', role: 'PRIVATE_ROLE', faction: 'PRIVATE_FACTION', note: 'PRIVATE_MOD_NOTE', secret: true }],
      scoreSheet: { fields: [{ id: 'sf_base', name: 'Base', key: 'base', kind: 'manual', effect: 1, includeInTotal: true }], values: { tp_1: { sf_base: 12 } } },
      campaign: { enabled: true, name: 'Legacy', chapter: 'Chapter 2', sessionNumber: 3, notes: 'PRIVATE_CAMPAIGN_NOTE', flags: [{ id: 'flag_1', name: 'PRIVATE_FLAG_LABEL', checked: true }] }
    })
  });

  saveGameToArchive({ ...sampleGame, id: 'game_table_os' }, storage);
  const [saved] = loadArchive(storage);
  assert.equal(saved.tableOs.phase.name, 'Night');
  assert.equal(saved.tableOs.phase.cycle, 2);
  assert.equal(saved.tableOs.scores[0].total, 12);
  assert.equal(saved.tableOs.trackers[0].values[0].value, 7);
  assert.equal(saved.tableOs.campaign.sessionNumber, 3);
  assert.equal(saved.tableOs.campaign.completedFlags, 1);
  const serialized = storage.getItem(ARCHIVE_STORAGE_KEY);
  for (const secret of ['PRIVATE_ROLE', 'PRIVATE_FACTION', 'PRIVATE_MOD_NOTE', 'PRIVATE_PHASE_NOTE', 'PRIVATE_CAMPAIGN_NOTE', 'PRIVATE_FLAG_LABEL']) {
    assert.equal(serialized.includes(secret), false, \`archive must not persist \${secret}\`);
  }

  const wrongStorage = fakeStorage({
    [STORAGE_KEY]: storage.getItem(STORAGE_KEY),
    [TABLE_OS_STORAGE_KEY]: storage.getItem(TABLE_OS_STORAGE_KEY),
    [TABLE_OS_COMPANION_STORAGE_KEY]: JSON.stringify({ associatedMainSessionId: 'round:some-other-game' })
  });
  saveGameToArchive({ ...sampleGame, id: 'game_wrong_session' }, wrongStorage);
  assert.equal(loadArchive(wrongStorage)[0].tableOs, null, 'stale Table OS state is not attached to another game');
});

`;
          archiveTest = replaceOnce(archiveTest, testAnchor, privacyTest + testAnchor, 'archive privacy test');
          fs.writeFileSync(archiveTestPath, archiveTest);

          const companionTestPath = 'tests/e2e/run-table-os-companion-e2e.js';
          let companionTest = fs.readFileSync(companionTestPath, 'utf8');
          const touchAnchor = 'async function runTouchTargetSmoke() {';
          const archiveFlow = `async function runArchiveSummaryFlow() {
  const context = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'en-US' });
  const page = await context.newPage();
  const errors = [];
  page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
  page.on('pageerror', error => errors.push(error.message));
  page.on('dialog', dialog => dialog.accept());

  await page.goto(url, { waitUntil: 'networkidle' });
  await page.evaluate(() => localStorage.clear());
  await page.reload({ waitUntil: 'networkidle' });
  await page.locator('[data-action="start-session"]').click();
  await openTableOs(page);
  await page.locator('[data-os-quick-template="engine-score"]').click();
  await page.getByRole('button', { name: 'Score sheet', exact: true }).click();
  const scoreValue = page.locator('[data-os-score-value]').first();
  await scoreValue.fill('11');
  await scoreValue.blur();
  await page.getByRole('button', { name: 'Phases', exact: true }).click();
  await page.locator('[data-os-action="next-phase"]').click();
  await page.locator('.tableos-header [data-os-action="close"]').click();

  await page.getByRole('tab', { name: 'Results', exact: true }).click();
  await page.getByRole('button', { name: 'Finish Game', exact: true }).click();
  const archiveItem = page.locator('.archive-item').first();
  await archiveItem.locator('summary').click();
  const advanced = archiveItem.locator('[data-archive-table-os]');
  await advanced.waitFor({ state: 'visible' });
  assert.match(await advanced.textContent(), /Advanced table summary/);
  assert.match(await advanced.textContent(), /Advanced score/);
  assert.match(await advanced.textContent(), /Phase/);

  const archived = await page.evaluate(() => JSON.parse(localStorage.getItem('board-game-assistant-archive-v1'))?.[0]);
  assert.ok(archived?.tableOs, 'finished main game stores a Table OS summary');
  assert.ok(Array.isArray(archived.tableOs.scores) && archived.tableOs.scores.some(player => player.total === 11), 'archive captures the live advanced score');
  assert.equal('roles' in archived.tableOs, false, 'archive summary has no private-role payload');
  assert.equal(errors.length, 0, \`archive bridge console errors: \${errors.join(' | ')}\`);
  await context.close();
}

`;
          companionTest = replaceOnce(companionTest, touchAnchor, archiveFlow + touchAnchor, 'archive companion flow');
          companionTest = replaceOnce(companionTest,
            "  await runPrimaryFlow();\n  await runQuietLifecycleFlow();\n  await runSessionLifecycleFlow();\n  await runTouchTargetSmoke();\n",
            "  await runPrimaryFlow();\n  await runQuietLifecycleFlow();\n  await runSessionLifecycleFlow();\n  await runArchiveSummaryFlow();\n  await runTouchTargetSmoke();\n",
            'archive companion run call');
          companionTest = replaceOnce(companionTest,
            "      'campaign tracker persistence across rematch', 'transient state reset across rematch',\n      '44px live touch targets', '320px overflow'\n",
            "      'campaign tracker persistence across rematch', 'transient state reset across rematch',\n      'privacy-safe Table OS archive summary', '44px live touch targets', '320px overflow'\n",
            'archive companion summary');
          fs.writeFileSync(companionTestPath, companionTest);
          NODE

      - name: Commit generated source changes
        shell: bash
        run: |
          rm .github/workflows/table-os-archive-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tabletop-core.js src/tabletop-companion.js src/archive.js src/app.js src/i18n.js tests/unit/archive.test.js tests/e2e/run-table-os-companion-e2e.js .github/workflows/table-os-archive-migrate.yml
          git diff --cached --check
          git commit -m "feat: archive privacy-safe Table OS summaries"
          git push origin HEAD:feat/table-os-archive-summary-20260912
