name: Migrate edit team replacement confirmation

on:
  push:
    branches:
      - fix/edit-team-replacement-confirmation

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/edit-team-replacement-confirmation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python3 .github/scripts/migrate-edit-team-replacement-confirmation.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Commit product changes and remove migration scaffolding
        run: |
          rm .github/scripts/migrate-edit-team-replacement-confirmation.py
          rm .github/workflows/migrate-edit-team-replacement-confirmation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: confirm destructive toolbox team replacement"
          git push origin HEAD:fix/edit-team-replacement-confirmation
