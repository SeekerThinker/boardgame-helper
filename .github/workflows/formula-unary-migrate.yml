name: Formula Unary Migration

on:
  push:
    branches:
      - fix/formula-unary-operators-20260912
    paths:
      - .github/workflows/formula-unary-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/formula-unary-operators-20260912
          fetch-depth: 0

      - name: Replace formula parser and add regression coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const corePath = 'src/tabletop-core.js';
          let core = fs.readFileSync(corePath, 'utf8');
          const parserStart = core.indexOf("const PRECEDENCE = { '+': 1, '-': 1, '*': 2, '/': 2 };");
          const parserEnd = core.indexOf('\nexport function scoreCardForParticipant', parserStart);
          if (parserStart < 0 || parserEnd < 0) throw new Error('formula parser boundary not found');

          const parser = `export function evaluateFormula(expression, variables = {}) {
            let tokens;
            try { tokens = tokenizeFormula(expression); } catch (error) { return { ok: false, value: 0, error: error.message }; }
            if (!tokens.length) return { ok: true, value: 0, error: null };

            let index = 0;
            const peek = () => tokens[index];
            const take = () => tokens[index++];

            function parsePrimary() {
              const token = take();
              if (token == null) throw new Error('invalid-expression');
              if (/^\\d/.test(token)) return Number(token);
              if (/^[A-Za-z_]/.test(token)) return number(variables[token], 0);
              if (token === '(') {
                const value = parseExpression();
                if (take() !== ')') throw new Error('unbalanced-parentheses');
                return value;
              }
              if (token === ')') throw new Error('unbalanced-parentheses');
              throw new Error('invalid-expression');
            }

            function parseUnary() {
              const token = peek();
              if (token === '+' || token === '-') {
                take();
                const value = parseUnary();
                return token === '-' ? -value : value;
              }
              return parsePrimary();
            }

            function parseTerm() {
              let value = parseUnary();
              while (peek() === '*' || peek() === '/') {
                const operator = take();
                const right = parseUnary();
                if (operator === '*') value *= right;
                else {
                  if (right === 0) throw new Error('division-by-zero');
                  value /= right;
                }
              }
              return value;
            }

            function parseExpression() {
              let value = parseTerm();
              while (peek() === '+' || peek() === '-') {
                const operator = take();
                const right = parseTerm();
                value = operator === '+' ? value + right : value - right;
              }
              return value;
            }

            try {
              const value = parseExpression();
              if (index !== tokens.length) {
                if (peek() === ')') throw new Error('unbalanced-parentheses');
                throw new Error('invalid-expression');
              }
              if (!Number.isFinite(value)) throw new Error('invalid-result');
              return { ok: true, value: Math.round(value * 100) / 100, error: null };
            } catch (error) {
              return { ok: false, value: 0, error: error.message };
            }
          }
          `;

          core = core.slice(0, parserStart) + parser + core.slice(parserEnd);
          fs.writeFileSync(corePath, core);

          const unitPath = 'tests/unit/tabletop-core.test.js';
          let unit = fs.readFileSync(unitPath, 'utf8');
          const anchor = "  assert.equal(evaluateFormula('-5 + a', { a: 8 }).value, 3);\n";
          if (!unit.includes(anchor)) throw new Error('unit formula anchor not found');
          unit = unit.replace(anchor, anchor +
            "  assert.equal(evaluateFormula('a * -2', { a: 3 }).value, -6, 'unary minus works after multiplication');\n" +
            "  assert.equal(evaluateFormula('-(a + b)', { a: 4, b: 3 }).value, -7, 'unary minus works before parentheses');\n" +
            "  assert.equal(evaluateFormula('a / -2', { a: 8 }).value, -4, 'unary minus works after division');\n" +
            "  assert.equal(evaluateFormula('--5 + +a', { a: 2 }).value, 7, 'nested unary operators are deterministic');\n" +
            "  assert.equal(evaluateFormula('2(3)', {}).ok, false, 'implicit multiplication stays rejected');\n" +
            "  assert.equal(evaluateFormula('a / -(b - b)', { a: 8, b: 3 }).ok, false, 'division by unary zero stays rejected');\n");
          fs.writeFileSync(unitPath, unit);

          const e2ePath = 'tests/e2e/run-table-os-e2e.js';
          let e2e = fs.readFileSync(e2ePath, 'utf8');
          const e2eAnchor = "  assert.equal(await firstScoreCard.locator('output').last().textContent(), '13');\n";
          if (!e2e.includes(e2eAnchor)) throw new Error('E2E formula anchor not found');
          e2e = e2e.replace(e2eAnchor, e2eAnchor + `

            // Unary +/- follows ordinary arithmetic precedence in real formula-field editing.
            await editMode(page);
            await page.getByRole('button', { name: '计分表', exact: true }).click();
            const netFormula = page.locator('[data-os-score-formula]').first();
            await netFormula.fill('-(base + bonus) / -2 + objective - penalty');
            await netFormula.blur();
            await page.getByRole('button', { name: '牌局模式' }).click();
            await page.getByRole('button', { name: '计分表', exact: true }).click();
            assert.equal(await page.locator('.tableos-score-table > article').first().locator('output').last().textContent(), '5', 'unary formula syntax works through the live score sheet');
          `);
          e2e = e2e.replace("      'toolbox-team bridge', 'two-stage private role reveal', 'moderator-note isolation', 'formula score sheet',\n", "      'toolbox-team bridge', 'two-stage private role reveal', 'moderator-note isolation', 'formula score sheet', 'unary formula operators',\n");
          fs.writeFileSync(e2ePath, e2e);
          NODE

      - name: Commit generated source changes
        shell: bash
        run: |
          rm .github/workflows/formula-unary-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tabletop-core.js tests/unit/tabletop-core.test.js tests/e2e/run-table-os-e2e.js .github/workflows/formula-unary-migrate.yml
          git diff --cached --check
          git commit -m "fix: support unary operators in score formulas"
          git push origin HEAD:fix/formula-unary-operators-20260912
