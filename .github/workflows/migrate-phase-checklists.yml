name: Migrate phase checklists

on: [push]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase-checklists
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Align current release-gate wording for focused migration
        run: sed -i 's/, destructive template disclosure for entity reset//' docs/TABLE_OS_TEST_MATRIX.md
      - name: Apply focused patch
        run: python .github/tmp/add-phase-checklists.py
      - name: Fix generated Chromium details interaction
        run: python .github/tmp/fix-phase-checklist-e2e.py
      - name: Restore entity-reset gate wording
        run: sed -i 's/campaign survival across built-in\/My Template changes, local My Templates/campaign survival across built-in\/My Template changes, destructive template disclosure for entity reset, local My Templates/' docs/TABLE_OS_TEST_MATRIX.md
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full check
        run: npm run check
      - name: Commit product tree and remove temporary migration files
        run: |
          rm .github/tmp/add-phase-checklists.py
          rm .github/tmp/fix-phase-checklist-e2e.py
          rm .github/workflows/migrate-phase-checklists.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: add phase checklists"
          git push
