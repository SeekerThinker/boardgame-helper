name: Migrate table entities
on:
  push:
    branches:
      - feat/table-os-lightweight-entities-20260913
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply focused migration
        run: |
          python3 entity-core.txt
          sed -i "s/name = 'Tracker, scope/name = 'Tracker', scope/" src/tabletop-core.js
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate repository
        run: npm run check
      - name: Commit validated product tree
        run: |
          rm entity-core.txt entity-ui.txt entity-migration.txt entity-tests.txt .github/workflows/migrate-table-os-entities.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: add lightweight table entities core"
          git push
