name: Temporary My Templates Migration

on:
  push:
    branches:
      - feat/table-os-my-templates-20260913

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply focused My Templates changes
        run: python scripts/migrate-my-templates.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate focused migration
        run: npm run check
      - name: Commit product changes and remove migration files
        shell: bash
        run: |
          git rm .github/workflows/migrate-my-templates.yml scripts/migrate-my-templates.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tabletop-core.js src/tabletop.js tests/unit/tabletop-core.test.js tests/e2e/run-table-os-e2e.js TABLE_OS.md docs/TABLE_OS_TEST_MATRIX.md
          git commit -m "feat: add local Table OS templates"
          git push
