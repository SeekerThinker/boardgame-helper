name: Migrate team replacement cleanup

on:
  push:
    branches:
      - fix/table-os-team-replacement-cleanup-20260913

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/table-os-team-replacement-cleanup-20260913
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Apply migration
        run: node scripts/migrate-team-replacement-cleanup.mjs
      - name: Repair generated companion fixture
        run: |
          sed -i 's/values: { old_team: true }],/values: { old_team: true } }],/' tests/e2e/run-table-os-companion-e2e.js
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/run-table-os-companion-e2e.js')
          source = path.read_text()
          needle = "  assert.equal(JSON.stringify(replaced).includes('old_team'), false, 'retired team ids do not survive persistence');\n\n  await page.getByRole('button', { name: 'Statuses', exact: true }).click();"
          replacement = "  assert.equal(JSON.stringify(replaced).includes('old_team'), false, 'retired team ids do not survive persistence');\n\n  await page.getByRole('button', { name: 'Play mode', exact: true }).click();\n  await page.getByRole('button', { name: 'Statuses', exact: true }).click();"
          if needle not in source:
              raise SystemExit('expected live-view fixture marker not found')
          path.write_text(source.replace(needle, replacement, 1))
          PY
      - name: Validate
        run: npm run check
      - name: Commit validated feature tree
        run: |
          rm scripts/migrate-team-replacement-cleanup.mjs
          rm .github/workflows/migrate-team-replacement-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: clear stale team-scoped values on team replacement"
          git push origin HEAD:fix/table-os-team-replacement-cleanup-20260913
