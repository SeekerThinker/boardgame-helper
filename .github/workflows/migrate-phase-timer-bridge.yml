name: Migrate phase timer bridge

on:
  push:
    branches:
      - feat/phase-timer-bridge
    paths:
      - .github/tmp/migrate-phase-timer-bridge.py
      - .github/workflows/migrate-phase-timer-bridge.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply focused patch
        run: python .github/tmp/migrate-phase-timer-bridge.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full check
        run: npm run check
      - name: Commit product tree and remove temporary migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/tmp/migrate-phase-timer-bridge.py .github/workflows/migrate-phase-timer-bridge.yml
          git add -A
          git commit -m "feat: bridge phases to main timer"
          git push origin HEAD:feat/phase-timer-bridge
